# Server block of the web image (replaces conf.d/default.conf of nginx-unprivileged). Listens on 8080, runs as uid 101.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The app shell and the runtime config are never cached, so a new deployment or a changed config.json shows at the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Angular's production build puts a content hash in every file name (main-ABCD1234.js), so they never change.
    # (quoted: nginx would read the braces as a block)
    location ~ "-[A-Z0-9]{8}\.(js|css|woff2?|png|jpe?g|svg|webp|avif|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the app shell (not cached, like index.html itself).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
