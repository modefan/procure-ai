# nginx.conf of the dashboard pod's front door (plan 08b finding 2): nginx in front of the Aspire dashboard, in the same pod. It passes
# everything through unchanged (pages, static files, Blazor's WebSocket /_blazor, the OIDC callback) and adds one same-origin script to
# each HTML page: /_procure/virtualize-nudge.js, the workaround for the dashboard's blank tables (files/virtualize-nudge.js). The Service
# and Traefik reach nginx on 8080; the dashboard's frontend port __DASHBOARD_PORT__ is reached through the pod's loopback (the
# NetworkPolicy lets Traefik in on 8080 only). Forwarded headers come from Traefik and are passed on as they are (X-Forwarded-Proto is
# https: the Ingress's middleware), so the dashboard's redirect URI and its WebSocket Origin check see what they saw without the proxy.
# Read-only root filesystem: the pid file and every temp path are in /tmp (an emptyDir).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # The dashboard has its own sign-in; no access log (it would list every page and WebSocket of the operator).
    access_log off;
    # No nginx version in the Server header or on error pages (as the web image).
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        # The dashboard takes no uploads; the OIDC callback (form_post) is small.
        client_max_body_size 1m;

        # Pages and scripts come uncompressed from the dashboard (sub_filter needs plain text); nginx compresses what it sends on.
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

        location = /_procure/virtualize-nudge.js {
            alias /etc/procure-dashboard-proxy/virtualize-nudge.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The Host as the browser sent it, port included ($host drops it): the WebSocket Origin check compares host and port.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Accept-Encoding "";
            # Blazor streams its pages and keeps the WebSocket open (it pings every 15 s).
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            sub_filter '</head>' '<script src="/_procure/virtualize-nudge.js"></script></head>';
            # Only text/html responses (sub_filter's default type).
            sub_filter_once on;
        }
    }
}
