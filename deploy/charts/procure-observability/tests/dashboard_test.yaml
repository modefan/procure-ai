# The standalone Aspire dashboard.
suite: dashboard
templates:
  - dashboard.yaml
release:
  name: observability
  namespace: observability
tests:
  - it: dashboard uses oidc
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: aspire-dashboard
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^mcr\.microsoft\.com/dotnet/aspire-dashboard:\d+\.\d+\.\d+$'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__AuthMode
            value: OpenIdConnect
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__Authority
            value: https://auth.procure.localtest.me/realms/procure
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__ClientId
            value: aspire-dashboard
      # The client secret from Secret procure-keycloak (bootstrap/new-secrets.ps1 copies only this key into namespace observability).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__ClientSecret
            valueFrom:
              secretKeyRef:
                name: procure-keycloak
                key: dashboard-secret
      # Only users with the aspire-dashboard client role dashboard-viewer (claim dashboard_roles, realm mapper).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__OpenIdConnect__RequiredClaimType
            value: dashboard_roles
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__OpenIdConnect__RequiredClaimValue
            value: dashboard-viewer
      # OTLP without a key: only the collector can reach the port (network-policies.yaml).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Otlp__AuthMode
            value: Unsecured
      # TLS ends at Traefik: the redirect URI must be https://<host>/, its fixed callback path (the dashboard ignores ASPNETCORE_FORWARDEDHEADERS_ENABLED; it reads its own switch).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ASPIRE_DASHBOARD_FORWARDEDHEADERS_ENABLED
            value: "true"
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "Dashboard__Frontend__AuthMode" && @.value == "Unsecured")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS")]

  # Security-guidance finding on the first commit: the dashboard API (telemetry API /api/telemetry and the MCP server, Dashboard:Api in
  # 13.6) has its own auth mode and is not needed here, so it is switched off (both keys 13.6.2 reads: Dashboard:Api:Disabled and
  # Dashboard:Api:Enabled), and its MCP port 18891 is neither a container port nor in the Service.
  # Its public address behind Traefik (the URL it shows and links to). Note: 13.6.2 still rejects Blazor's WebSocket behind the proxy
  # ("disallowed Origin"), and the browser falls back to long polling, which works (plan 07 Task 7 report).
  - it: dashboard knows its public url
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__PublicUrl
            value: https://dashboard.procure.localtest.me

  - it: dashboard api and mcp server are disabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Api__Disabled
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Api__Enabled
            value: "false"
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "Dashboard__Api__AuthMode" && @.value == "Unsecured")]
      - notExists:
          path: spec.template.spec.containers[0].ports[?(@.containerPort == 18891 || @.containerPort == 18890)]

  - it: dashboard trusts the local CA (Keycloak's certificate)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: /etc/ssl/certs:/etc/procure-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: procure-ca
            configMap:
              name: procure-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: procure-ca
            mountPath: /etc/procure-ca
            readOnly: true

  - it: dashboard ingress is dashboard.procure.localtest.me on the frontend port
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].host
          value: dashboard.procure.localtest.me
      - equal:
          path: spec.tls[0].hosts
          value: [dashboard.procure.localtest.me]
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: aspire-dashboard
            port:
              name: http

  - it: dashboard service exposes the frontend and the otlp grpc port only
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: aspire-dashboard
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 18888
              targetPort: http
              protocol: TCP
            - name: otlp-grpc
              port: 18889
              targetPort: otlp-grpc
              protocol: TCP
