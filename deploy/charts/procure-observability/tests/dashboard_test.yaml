# The standalone Aspire dashboard.
suite: dashboard
templates:
  - dashboard.yaml
  - dashboard-proxy.yaml
release:
  name: observability
  namespace: observability
tests:
  - it: dashboard uses oidc
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: aspire-dashboard
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^mcr\.microsoft\.com/dotnet/aspire-dashboard:\d+\.\d+\.\d+$'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__AuthMode
            value: OpenIdConnect
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__Authority
            value: https://auth.procure.localtest.me/realms/procure
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__ClientId
            value: aspire-dashboard
      # The client secret from Secret procure-keycloak (bootstrap/new-secrets.ps1 copies only this key into namespace observability).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Authentication__Schemes__OpenIdConnect__ClientSecret
            valueFrom:
              secretKeyRef:
                name: procure-keycloak
                key: dashboard-secret
      # Only users with the aspire-dashboard client role dashboard-viewer (claim dashboard_roles, realm mapper).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__OpenIdConnect__RequiredClaimType
            value: dashboard_roles
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__OpenIdConnect__RequiredClaimValue
            value: dashboard-viewer
      # OTLP without a key: only the collector can reach the port (network-policies.yaml).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Otlp__AuthMode
            value: Unsecured
      # TLS ends at Traefik: the redirect URI must be https://<host>/, its fixed callback path (the dashboard ignores ASPNETCORE_FORWARDEDHEADERS_ENABLED; it reads its own switch).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ASPIRE_DASHBOARD_FORWARDEDHEADERS_ENABLED
            value: "true"
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "Dashboard__Frontend__AuthMode" && @.value == "Unsecured")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS")]

  # Security-guidance finding on the first commit: the dashboard API (telemetry API /api/telemetry and the MCP server, Dashboard:Api in
  # 13.6) has its own auth mode and is not needed here, so it is switched off (both keys 13.6.2 reads: Dashboard:Api:Disabled and
  # Dashboard:Api:Enabled), and its MCP port 18891 is neither a container port nor in the Service.
  # Its public address behind Traefik (the URL it shows and links to).
  - it: dashboard knows its public url
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Frontend__PublicUrl
            value: https://dashboard.procure.localtest.me

  - it: dashboard api and mcp server are disabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Api__Disabled
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__Api__Enabled
            value: "false"
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "Dashboard__Api__AuthMode" && @.value == "Unsecured")]
      - notExists:
          path: spec.template.spec.containers[0].ports[?(@.containerPort == 18891 || @.containerPort == 18890)]

  - it: dashboard trusts the local CA (Keycloak's certificate)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: /etc/ssl/certs:/etc/procure-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: procure-ca
            configMap:
              name: procure-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: procure-ca
            mountPath: /etc/procure-ca
            readOnly: true

  - it: dashboard ingress is dashboard.procure.localtest.me on the frontend port
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].host
          value: dashboard.procure.localtest.me
      - equal:
          path: spec.tls[0].hosts
          value: [dashboard.procure.localtest.me]
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: aspire-dashboard
            port:
              name: http

  # Plan 08b finding 1: Traefik sends X-Forwarded-Proto: wss on WebSocket upgrades, the dashboard's Origin check then compared https
  # with wss and refused every Blazor circuit (403). The Ingress forces https, the scheme the browser always uses for this host.
  - it: dashboard ingress forces X-Forwarded-Proto https through its middleware
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: observability-aspire-dashboard-forwarded-proto@kubernetescrd
      # One Ingress for every path of the host, so /_blazor gets the middleware too (no path of its own that could miss it).
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /

  - it: dashboard forwarded-proto middleware sets exactly https and nothing else
    documentSelector:
      path: kind
      value: Middleware
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1
      - equal:
          path: metadata.name
          value: aspire-dashboard-forwarded-proto
      - equal:
          path: spec
          value:
            headers:
              customRequestHeaders:
                X-Forwarded-Proto: https

  - it: dashboard service exposes the frontend and the otlp grpc port only
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: aspire-dashboard
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 18888
              targetPort: http
              protocol: TCP
            - name: otlp-grpc
              port: 18889
              targetPort: otlp-grpc
              protocol: TCP

  # Plan 08 Task 6: the SQLite telemetry database (in /tmp) filled the 64Mi emptyDir and the pod was evicted about every 10 minutes. /tmp is
  # sized for the measured bound, and the metric points per dimension are capped for real.
  - it: dashboard keeps its telemetry database on a sized tmp emptyDir
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 512Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Dashboard__TelemetryLimits__MaxMetricsCount
            value: "200"

  # Plan 08b finding 2: nginx in the dashboard's pod adds the blank-table workaround (files/virtualize-nudge.js) to every page. The
  # Service and the NetworkPolicy's port `http` now lead to nginx; the dashboard's own frontend port is `frontend`.
  - it: dashboard proxy sits in front of the frontend in the same pod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value: { name: frontend, containerPort: 18888, protocol: TCP }
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: frontend
      - equal:
          path: spec.template.spec.containers[1].name
          value: proxy
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: '^docker\.io/nginxinc/nginx-unprivileged:\d+\.\d+\.\d+-alpine-slim$'
      - equal:
          path: spec.template.spec.containers[1].command
          value: ["nginx", "-g", "daemon off;"]
      - equal:
          path: spec.template.spec.containers[1].ports
          value:
            - { name: http, containerPort: 8080, protocol: TCP }
      - equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content: { name: proxy, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
      - exists:
          path: spec.template.metadata.annotations["checksum/proxy"]

  - it: dashboard proxy config passes everything through and adds the nudge script
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: metadata.name
          value: aspire-dashboard-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://127\.0\.0\.1:18888;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'sub_filter ''</head>'' ''<script src="/_procure/virtualize-nudge\.js"></script></head>'';'
      # Forwarded headers and the Host pass through unchanged, so the WebSocket Origin check and the redirect URI see what they saw before.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header Host \$http_host;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header X-Forwarded-Proto \$http_x_forwarded_proto;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header Connection \$connection_upgrade;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '__DASHBOARD_PORT__'
      - matchRegex:
          path: data["virtualize-nudge.js"]
          pattern: 'table\.fluent-data-grid'

  - it: without the proxy the dashboard's frontend is port http again
    set:
      dashboard.proxy.enabled: false
    asserts:
      # No proxy ConfigMap.
      - hasDocuments:
          count: 0
        template: dashboard-proxy.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
        documentSelector: { path: kind, value: Deployment }
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentSelector: { path: kind, value: Deployment }
