# The OpenTelemetry Collector (subchart opentelemetry-collector, DaemonSet): its rendered configuration and pod.
suite: collector
templates:
  - charts/opentelemetry-collector/templates/configmap-agent.yaml
  - charts/opentelemetry-collector/templates/daemonset.yaml
  - charts/opentelemetry-collector/templates/service.yaml
release:
  name: observability
  namespace: observability
tests:
  # The .NET apps send their logs by OTLP; their pod logs (container `app`) would show every line twice. Only the platform's
  # containers are read from /var/log/pods.
  - it: collector excludes dotnet pod logs
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)receivers:.*file_?log:'
      - matchRegex:
          path: data.relay
          pattern: '(?s)include:\s*\n\s*- /var/log/pods/procure_postgres-\*_\*/postgres/\*\.log\s*\n\s*- /var/log/pods/procure_keycloak-\*_\*/keycloak/\*\.log\s*\n\s*- /var/log/pods/procure_rabbitmq-\*_\*/rabbitmq/\*\.log\s*\n\s*- /var/log/pods/procure_mongo-\*_\*/mongo/\*\.log\s*\n\s*- /var/log/pods/procure_redis-\*_\*/redis/\*\.log\s*\n\s*- /var/log/pods/procure_debezium-\*_\*/debezium/\*\.log\s*\n'
      # The container parser takes namespace, pod and container from the file path (it fails every line without it, seen on the cluster).
      - matchRegex:
          path: data.relay
          pattern: 'include_file_path: true'
      # New lines only (reading the files from the start flooded the dashboard's log limit with old history).
      - matchRegex:
          path: data.relay
          pattern: 'start_at: end'
      # No catch-all pattern, and nothing that could match an app's container (`app`) or another namespace.
      - notMatchRegex:
          path: data.relay
          pattern: '/var/log/pods/\*'
      - notMatchRegex:
          path: data.relay
          pattern: '/app/'
      - notMatchRegex:
          path: data.relay
          pattern: '/var/log/pods/(?:argocd|kube-system|observability)_'

  - it: collector pipelines are otlp and filelog through memory_limiter, k8sattributes and batch to the dashboard (logs also through filter/platform-noise and transform/redact, traces through tail_sampling)
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)logs:\s*\n\s*exporters:\s*\n\s*- otlp(_grpc)?\s*\n\s*processors:\s*\n\s*- memory_limiter\s*\n\s*- filter/platform-noise\s*\n\s*- k8s_?attributes\s*\n\s*- transform/redact\s*\n\s*- transform/client-address\s*\n\s*- batch\s*\n\s*receivers:\s*\n\s*- otlp\s*\n\s*- file_?log\s*\n'
      - matchRegex:
          path: data.relay
          pattern: '(?s)traces:\s*\n\s*exporters:\s*\n\s*- otlp(_grpc)?\s*\n\s*processors:\s*\n\s*- memory_limiter\s*\n\s*- k8s_?attributes\s*\n\s*- tail_sampling\s*\n\s*- transform/client-address\s*\n\s*- batch\s*\n\s*receivers:\s*\n\s*- otlp\s*\n'
      - matchRegex:
          path: data.relay
          pattern: '(?s)metrics:\s*\n\s*exporters:\s*\n\s*- otlp(_grpc)?\s*\n\s*processors:\s*\n\s*- memory_limiter\s*\n\s*- k8s_?attributes\s*\n\s*- batch\s*\n\s*receivers:\s*\n\s*- otlp\s*\n'
      - matchRegex:
          path: data.relay
          pattern: 'endpoint: aspire-dashboard\.observability:18889'
      # Nothing else listens: no jaeger, zipkin or prometheus receiver (the chart's unused `debug: {}` exporter stays defined, Helm
      # cannot null an empty-map default of a subchart; no pipeline uses it, so the collector never starts it).
      - notMatchRegex:
          path: data.relay
          pattern: 'jaeger|zipkin|prometheus:'
      - notMatchRegex:
          path: data.relay
          pattern: '- debug'

  # Personal data (usernames, e-mail and IP addresses) in the platform's own logs is masked before the dashboard sees it (CLAUDE.md
  # "Observability": logs carry trace ID, tenant and user ID, never personal data). The behaviour is tested against the real collector
  # image in tests/collector/Test-CollectorRedaction.ps1; this test only pins the wiring.
  - it: logs pipeline runs transform/redact before export
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)logs:\s*\n\s*exporters:\s*\n\s*- otlp(_grpc)?\s*\n\s*processors:\s*\n(\s*- \S+\n)*?\s*- transform/redact\s*\n\s*- transform/client-address\s*\n\s*- batch\s*\n'
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/redact:.*?log_statements:'
      # The traces and metrics pipelines have no use for it.
      - notMatchRegex:
          path: data.relay
          pattern: '(?s)(traces|metrics):\s*\n\s*exporters:\s*\n\s*- otlp(_grpc)?\s*\n\s*processors:\s*\n(\s*- \S+\n)*?\s*- transform/redact'

  # Plan 08b finding 3 (replaces plan 07's span filter filter/background-db, which dropped only the root span and left its children as
  # traces of their own): whole background traces are dropped (a database or cache root, Wolverine's node-assignment poll, the
  # chaos-switch poll), unless their root failed; every other trace is kept. The behaviour is tested against the real collector image in
  # tests/collector/Test-CollectorRedaction.ps1; this pins the wiring. (Long OTTL strings are folded over lines in the rendered YAML.)
  - it: collector drops whole background traces only
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - notMatchRegex:
          path: data.relay
          pattern: 'filter/background-db'
      - matchRegex:
          path: data.relay
          pattern: '(?s)tail_sampling:\s+decision_cache:.*decision_wait: 5s'
      - matchRegex:
          path: data.relay
          pattern: '(?s)policies:\s+- drop:\s+drop_sub_policy:\s+- name: background-root\s+ottl_condition:\s+error_mode: ignore\s+span:\s+- .?IsRootSpan\(\)\s+and\s+span\.status\.code\s+!=\s+STATUS_CODE_ERROR\s+and'
      - matchRegex:
          path: data.relay
          pattern: '(?s)background-root.*wolverine_node_assignments.*SPAN_KIND_CLIENT.*/api/v1/simulators/chaos\$.*name: drop-background-roots\s+type: drop\s+- name: keep-everything-else\s+type: always_sample'

  # Plan 08b finding 3: RabbitMQ's and MongoDB's per-connection lines (readiness probes) are dropped, only for those two resources and
  # matched by level and message; tested with samples in tests/collector/Test-CollectorRedaction.ps1.
  - it: collector drops only the platform's connection churn from the logs
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)filter/platform-noise:\s+error_mode: ignore\s+logs:\s+log_record:\s+- .?resource\.attributes\["service\.name"\] == "rabbitmq"\s+and\s+IsString\(log\.body\)\s+and\s+IsMatch\(log\.body\.string,\s+"\^'
      - matchRegex:
          path: data.relay
          pattern: '(?s)filter/platform-noise:.*resource\.attributes\["service\.name"\] == "mongo"\s+and.*\\"s\\":\\"I\\".*resource\.attributes\["service\.name"\] == "mongo"\s+and.*\\"s\\":\\"W\\".*\\"id\\":23234'

  # Review 12c M1: every OTTL path has its context prefix (the unprefixed form is the legacy one; the collector rewrites it with a
  # notice). Test-CollectorRedaction.ps1 also fails on that notice in the real collector's log.
  - it: collector OTTL paths carry their context prefix
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/redact:.*set\(log\.severity_text, "INFO"\) where IsString\(log\.body\) and IsMatch\(log\.body\.string,'
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/redact:.*set\(log\.severity_number, SEVERITY_NUMBER_INFO\) where IsString\(log\.body\)'
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/redact:.*replace_pattern\(log\.body\.string, .*where IsString\(log\.body\)'
      # No unprefixed path in any processor: a bare body/severity_*/attributes not preceded by a context name and a dot. (The
      # top-level keys are rendered in order; the processors' lines are the indented ones after `processors:`. The filelog operators'
      # `attributes[...]` under receivers are stanza fields, not OTTL.)
      - notMatchRegex:
          path: data.relay
          pattern: '\nprocessors:(\n  [^\n]*)*\n  [^\n]*[^.\w"](body|severity_text|severity_number|attributes)(\.|\[|,|\))'

  - it: collector reads pod logs read-only through group 0, not as root
    template: charts/opentelemetry-collector/templates/daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: collector-agent
      - contains:
          path: spec.template.spec.volumes
          content:
            name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
      # The preset's extra /var/lib/docker/containers mount is not needed (containerd writes the files under /var/log/pods).
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "varlibdockercontainers")]
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.supplementalGroups
          value: [0]
      - notExists:
          path: spec.template.spec.containers[0].ports[?(@.hostPort)]

  - it: collector service is collector.observability with the otlp ports only
    template: charts/opentelemetry-collector/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: collector
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[0].port
          value: 4317
      - equal:
          path: spec.ports[1].port
          value: 4318

  # Plan 08 Task 12c: a visitor's address never reaches the dashboard as a span or log attribute (log bodies: transform/redact).
  - it: collector deletes client address attributes from spans and logs
    template: charts/opentelemetry-collector/templates/configmap-agent.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/client-address:.*trace_statements:.*delete_key\(span\.attributes, "client\.address"\).*delete_key\(span\.attributes, "http\.client_ip"\)'
      - matchRegex:
          path: data.relay
          pattern: '(?s)transform/client-address:.*log_statements:.*delete_key\(log\.attributes, "client\.address"\)'
