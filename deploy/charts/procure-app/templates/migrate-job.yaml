{{- if .Values.migration.enabled }}
{{- $name := include "procure-app.migrationName" . }}
{{- $labels := dict "root" $ "name" $name "component" "migration" }}
{{- $env := merge (dict "DemoSeed__Enabled" .Values.migration.demoSeed) (.Values.migration.env | default dict) }}
# The app's migration (schema, Wolverine message store, demo seed): the same image and environment with --migrate. An Argo CD Sync hook in
# wave -1, so every sync (a new appRevision) reruns it before the Deployment (wave 0) changes, and a failing migration stops the sync
# while the old pods keep serving. The Helm hooks do the same for `helm upgrade --install` (Argo CD ignores them next to its own).
# It connects as the service's own role (<service>_app from Secret procure-connection-strings, plan 08 ruling 6). The database and the role
# come from the platform's db-roles Job (infra/postgres/roles.sql), which runs before the apps sync; the migration never needs the superuser.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "procure-app.labels" $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  # backoffLimit 0 is for the migration's own errors (plan 08 ruling 9), not for a pod the cluster took away: an eviction (node memory
  # pressure, API eviction) or a preemption marks the pod DisruptionTarget, which is not counted, so the Job starts a new pod instead of
  # failing the sync (and spending one of Argo CD's 3 retries). activeDeadlineSeconds still bounds the whole Job. A non-zero exit of the
  # migration (including a cgroup OOM kill, 137: a migration that does not fit its limit is a sizing bug to see at once) fails the Job.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: migrate
          operator: NotIn
          values: [0]
  # A missing Postgres or a hung migration fails the hook visibly (and with it the sync) instead of blocking it forever.
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "procure-app.labels" $labels | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "procure-app.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "procure-app.image" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --migrate
          env:
            {{- include "procure-app.env" (dict "root" $ "env" $env "secretEnv" .Values.migration.secretEnv) | trim | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "procure-app.containerSecurity" . | nindent 10 }}
          volumeMounts:
            {{- include "procure-app.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "procure-app.volumes" . | nindent 8 }}
{{- end }}
