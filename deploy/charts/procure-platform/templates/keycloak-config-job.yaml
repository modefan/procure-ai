{{- $c := .Values.keycloakConfig }}
{{- $labels := dict "root" $ "name" "keycloak-config" }}
# Realm updates through GitOps (plan 08 ruling 7). Keycloak imports the realm only on its first start (`--import-realm` skips a realm that
# exists, keycloak.yaml), so a realm change in Git would never reach an existing cluster. This Job runs keycloak-config-cli
# (adorsys, Apache 2.0) against the running Keycloak on every sync with the same file, so Git is the source of truth for the realm;
# a change made by hand in the admin console is put back by the next sync. Keycloak's own first-start import stays (a fresh install
# works without the Job; the Job then finds the realm as the file describes it and changes nothing).
#   realm files   the init container copies procure-realm.json (the demo realm) and ops-realm.json (realm ops: Argo CD's sign-in, plan 08
#                 fix wave ruling R6c) out of the deployed Keycloak image (the same bytes Keycloak imported, no copy in the chart) and rewrites only the defaults' syntax: Keycloak writes ${KC_X:default}, keycloak-config-cli (Apache
#                 Commons Text) ${KC_X:-default}. No value passes through sed: keycloak-config-cli fills every ${KC_...} placeholder from
#                 its environment, the same variables and Secret keys as the Keycloak Deployment.
#   when          a Sync hook in wave 1: Argo CD starts it once wave 0 (Keycloak's Deployment) is Healthy, i.e. Keycloak is Ready, next
#                 to db-roles and before Debezium (wave 2); it waits for Keycloak itself too (availability check), which is all there is
#                 under Helm (no hooks: a plain Job per revision, like the other bootstrap Jobs). Rerun on every sync (BeforeHookCreation);
#                 a succeeded Job is deleted (HookSucceeded), a failed one stays for its log until the next sync.
#   what it owns  only what the file declares (see keycloakConfig in values.yaml): remote state on, so it deletes only what it imported
#                 itself; organizations no-delete, so self-registered members of `demo` (Access adds them) stay; users and resource types
#                 the file does not list (built-in clients and scopes, default roles, flows, required actions) are left alone.
#   access        through the Service (NetworkPolicy allow-direct-callers-keycloak lets this Job's pods in), on the master realm as
#                 - with keycloakConfig.automationClient (plan 08b Task 4 fix round 1): the confidential master-realm client
#                   procure-automation (client credentials: no password, no user, so no brute-force lockout can stop a sync). The init
#                   container automation-client (files/keycloak-automation-client.sh) keeps it, signing in as the bootstrap admin only while
#                   the client does not work yet (a fresh install, the first sync after the change), and then disables the bootstrap admin
#                   (break-glass only; procure-ai docs/hosting.md).
#                 - without it: the bootstrap admin (Secret procure-keycloak, admin-username / admin-password) with its password.
#   master realm  with keycloakConfig.masterRealm.enabled (plan 08b Task 4) also files/keycloak-master-realm.json (ConfigMap
#                 keycloak-config-master): every password sign-in to the master realm (the admin console's browser flow AND password
#                 grants) asks for a one-time code, password guessers are locked out a while.
#   operator user with keycloakConfig.operatorUser (plan 08b Task 4) a second container (kcadm in our Keycloak image) keeps Dale's own
#                 master-realm admin: password and authenticator secret from Secret procure-keycloak (keys must exist when it is on).
{{- if $c.enabled }}
{{- if and $c.masterRealm.enabled (not $c.automationClient) }}
{{- fail "keycloakConfig.masterRealm.enabled needs keycloakConfig.automationClient: the master realm then asks every password sign-in for a one-time code, so the Job must sign in as a client" }}
{{- end }}
{{- if $c.masterRealm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-master
  labels:
    {{- include "procure-platform.labels" $labels | nindent 4 }}
  annotations:
    # Before the hook Job that mounts it (wave 1).
    argocd.argoproj.io/sync-wave: "0"
data:
  master-realm.json: |-
    {{- .Files.Get "files/keycloak-master-realm.json" | nindent 4 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "procure-platform.bootstrapJobName" (dict "root" $ "base" "keycloak-config") }}
  labels:
    {{- include "procure-platform.labels" $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  # Under Helm (no hook policy) the finished Job of a revision goes after a day.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "procure-platform.labels" $labels | nindent 8 }}
    spec:
      restartPolicy: Never
      # uid 65534: keycloak-config-cli's image user (nobody); the Keycloak image's realm file and sed are world-readable.
      {{- include "procure-platform.podSecurity" (dict "root" $ "uid" 65534 "gid" 65534) | nindent 6 }}
      initContainers:
        - name: realm-file
          image: {{ include "procure-platform.ownImage" (dict "root" $ "image" .Values.keycloak.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [bash, -c]
          args:
            - |
              set -eu
              for realm in procure ops; do
                sed -E 's/\$\{(KC_[A-Z0-9_]+):([^-])/${\1:-\2/g' "/opt/keycloak/data/import/$realm-realm.json" > "/config/$realm-realm.json"
              done
          resources:
            {{- toYaml .Values.helperResources | nindent 12 }}
          {{- include "procure-platform.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /config
        {{- with $c.automationClient }}
        # The automation's own master-realm client (plan 08b Task 4 fix round 1; files/keycloak-automation-client.sh): kept before anything
        # signs in with it; the bootstrap admin is used only while the client does not work yet, then disabled.
        - name: automation-client
          image: {{ include "procure-platform.ownImage" (dict "root" $ "image" $.Values.keycloak.image) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: [bash, -c]
          args:
            - {{ $.Files.Get "files/keycloak-automation-client.sh" | quote }}
          env:
            - name: CLIENT_ID
              value: {{ .clientId | quote }}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ .secretKey }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-password
            - name: DISABLE_BOOTSTRAP_ADMIN
              value: {{ .disableBootstrapAdmin | quote }}
            - name: HOME
              value: /run/kcadm-automation
            - name: JAVA_OPTS
              value: "-Xms32m -Xmx128m -XX:+ExitOnOutOfMemoryError"
          resources:
            {{- toYaml $.Values.helperResources | nindent 12 }}
          {{- include "procure-platform.containerSecurity" $ | nindent 10 }}
          volumeMounts:
            - name: kcadm-automation
              mountPath: /run/kcadm-automation
        {{- end }}
      containers:
        - name: keycloak-config
          image: {{ $c.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: {{ $c.availabilityTimeout | quote }}
            {{- with $c.automationClient }}
            # The automation client (client credentials on the master realm), never a password.
            - name: KEYCLOAK_LOGINREALM
              value: master
            - name: KEYCLOAK_GRANTTYPE
              value: client_credentials
            - name: KEYCLOAK_CLIENTID
              value: {{ .clientId | quote }}
            - name: KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ .secretKey }}
            {{- else }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-password
            {{- end }}
            - name: IMPORT_FILES_LOCATIONS
              value: {{ ternary "file:/config/procure-realm.json,file:/config/ops-realm.json,file:/master/master-realm.json" "file:/config/procure-realm.json,file:/config/ops-realm.json" $c.masterRealm.enabled }}
            # Apply the file on every run, not only when it changed: the cache would skip an unchanged file and keep a hand change.
            - name: IMPORT_CACHE_ENABLED
              value: "false"
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: IMPORT_VARSUBSTITUTION_PREFIX
              value: "${"
            - name: IMPORT_VARSUBSTITUTION_SUFFIX
              value: "}"
            {{- range $key, $value := $c.importSettings }}
            - name: {{ printf "IMPORT_%s" (upper (replace "-" "" (replace "." "_" $key))) }}
              value: {{ $value | quote }}
            {{- end }}
            # warn everywhere except the tool's own progress lines (logger group `kcc`, an alias of `keycloak-config-cli` that an
            # environment variable can name: Spring cannot bind a dash from one). The groups realm-config (the realm file with its secrets,
            # at trace) and http (the wire: requests and tokens, at debug) follow the root level.
            - name: LOGGING_LEVEL_ROOT
              value: warn
            - name: LOGGING_LEVEL_KCC
              value: {{ $c.logLevel | quote }}
            - name: JAVA_OPTS
              value: {{ $c.javaOpts | quote }}
            # The realm's placeholders (infra/keycloak/procure-realm.json), as the Keycloak Deployment sets them.
            {{- range $name, $key := $c.secretPlaceholders }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ $key }}
            {{- end }}
            - name: KC_APP_BASE_URL
              value: {{ printf "https://%s" .Values.hosts.app }}
            - name: KC_DASHBOARD_BASE_URL
              value: {{ printf "https://%s" .Values.hosts.dashboard }}
            - name: KC_ARGOCD_BASE_URL
              value: {{ .Values.keycloak.argocdUrl | quote }}
            - name: KC_ARGOCD_TUNNEL_URL
              value: {{ .Values.keycloak.argocdTunnelUrl | quote }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          {{- include "procure-platform.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $c.masterRealm.enabled }}
            - name: master
              mountPath: /master
              readOnly: true
            {{- end }}
        {{- with $c.operatorUser }}
        # Dale's own admin in the master realm (plan 08b Task 4), apart from the account the automation signs in as: password and a
        # pre-set authenticator (TOTP) secret from Secret procure-keycloak, so Claude can compute the code from DEMO PASSWORDS.txt. Created
        # when missing; recreated when the TOTP secret changed (a fingerprint of it is the OTP credential's label, ruling R2; Keycloak has
        # no API that replaces an OTP credential); otherwise only the password is set again and the admin role ensured. Secrets go into
        # files in a memory volume, never argv. Skipped when either key is missing.
        - name: operator-user
          image: {{ include "procure-platform.ownImage" (dict "root" $ "image" $.Values.keycloak.image) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: [bash, -c]
          args:
            - {{ $.Files.Get "files/keycloak-operator-user.sh" | quote }}
          env:
            - name: OPERATOR_USERNAME
              value: {{ .username | quote }}
            {{- with $c.automationClient }}
            # Signs in as the automation client (the init container made sure it works).
            - name: CLIENT_ID
              value: {{ .clientId | quote }}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ .secretKey }}
            {{- end }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: admin-password
            - name: OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ .passwordKey }}
            - name: OPERATOR_TOTP_BASE32
              valueFrom:
                secretKeyRef:
                  name: procure-keycloak
                  key: {{ .totpKey }}
            - name: HOME
              value: /run/kcadm
            - name: JAVA_OPTS
              value: "-Xms32m -Xmx128m -XX:+ExitOnOutOfMemoryError"
          resources:
            {{- toYaml $.Values.helperResources | nindent 12 }}
          {{- include "procure-platform.containerSecurity" $ | nindent 10 }}
          volumeMounts:
            - name: kcadm
              mountPath: /run/kcadm
        {{- end }}
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 8Mi
        {{- if $c.masterRealm.enabled }}
        - name: master
          configMap:
            name: keycloak-config-master
        {{- end }}
        {{- if $c.operatorUser }}
        - name: kcadm
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if $c.automationClient }}
        - name: kcadm-automation
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
