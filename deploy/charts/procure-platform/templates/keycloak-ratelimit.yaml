{{- /*
Rate limits on Keycloak's public host (plan 08 fix wave rulings R6b and R6c, instead of a per-user lockout in the demo realm, which let
anyone keep the shared demo users locked). Traefik RateLimit Middlewares, per client address: Traefik takes 80/443 as host ports, so the
remote address is the visitor's own (no X-Forwarded-For is trusted, and no ipStrategy reads one). IPv4 only: the host has A records only,
so IPv6 grouping does not apply.
  keycloak-ratelimit        on the keycloak Ingress itself (templates/keycloak.yaml), so EVERY path of the host is limited: no spelling
                            of a sign-in path (matrix parameters, encoded or upper-case segments) can reach Keycloak without a limit.
  keycloak-token-ratelimit  on its own Ingress for /realms/<realm>/protocol/openid-connect/token of each public realm (a longer prefix
                            wins in Traefik): inside the cluster the gateway reaches the same host through Traefik (CoreDNS rewrite), so
                            the gateway pod is ONE source for every visitor's code exchange, refresh and demo login; this limit is sized
                            for that. Any other spelling of the token path falls back to the stricter keycloak-ratelimit.
Traefik keeps one bucket per router, so per path prefix of the host (each realm, /resources/, each token endpoint), not one per host.
The token precedence relies on Traefik's default path cleaning (sanitizePath): never set entryPoints.*.http.sanitizePath=false, or
/realms/x/protocol/openid-connect/token/../auth would reach the auth endpoint through the looser token router.
*/}}
{{- $rl := .Values.keycloak.ingress.rateLimit }}
{{- if $rl.enabled }}
{{- if not .Values.keycloak.ingress.publicRealms }}{{ fail "keycloak.ingress.rateLimit needs keycloak.ingress.publicRealms" }}{{ end }}
{{- $labels := dict "root" $ "name" "keycloak" }}
{{- range $kind := list "all" "token" }}
{{- $limit := index $rl $kind }}
{{- if not (and $limit $limit.average $limit.period $limit.burst) }}{{ fail (printf "keycloak.ingress.rateLimit.%s needs average, period and burst" $kind) }}{{ end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ ternary "keycloak-ratelimit" "keycloak-token-ratelimit" (eq $kind "all") }}
  labels:
    {{- include "procure-platform.labels" $labels | nindent 4 }}
spec:
  rateLimit:
    average: {{ $limit.average }}
    period: {{ $limit.period }}
    burst: {{ $limit.burst }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-token
  labels:
    {{- include "procure-platform.labels" $labels | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-keycloak-token-ratelimit@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.hosts.keycloak }}
  rules:
    - host: {{ .Values.hosts.keycloak }}
      http:
        paths:
          {{- range $realm := .Values.keycloak.ingress.publicRealms }}
          - path: /realms/{{ $realm }}/protocol/openid-connect/token
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          {{- end }}
{{- end }}
