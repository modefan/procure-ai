{{- if .Values.networkPolicies.enabled }}
# Network policies of namespace procure (enforced by k3s's built-in policy controller). Ingress only; egress stays open (pods send
# telemetry to the observability namespace and reach Keycloak through Traefik by its public name).
#
# 1. Nothing may connect to a pod in procure unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "procure-platform.labels" (dict "root" $ "name" "network-policies") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Pods in procure may reach each other (services, databases, broker). Pods of other namespaces may not: a pod in `default` or
#    `observability` cannot open postgres:5432. Not the pods that trust forwarded headers (gateway, Keycloak): see 4.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  labels:
    {{- include "procure-platform.labels" (dict "root" $ "name" "network-policies") | nindent 4 }}
spec:
  {{- with .Values.networkPolicies.forwardedHeaderTrusting }}
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: {{ keys . | sortAlpha | toJson }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# 3. Traefik (kube-system) may reach the port named `http` of the pods that sit behind an Ingress (label procure.ai/ingress-backend),
#    nothing else: not Keycloak's management port, not Mailpit's SMTP, not the databases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-ingress-backends
  labels:
    {{- include "procure-platform.labels" (dict "root" $ "name" "network-policies") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      procure.ai/ingress-backend: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
          protocol: TCP
{{- range $name, $callers := .Values.networkPolicies.forwardedHeaderTrusting }}
---
# 4. {{ $name }} trusts X-Forwarded-* from the pod network (plan 08 ruling 5), so only Traefik and its listed direct callers may connect to
#    its http port; another pod could otherwise send any X-Forwarded-For. Nothing else of the pod (e.g. Keycloak's management port) is open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-direct-callers-{{ $name }}
  labels:
    {{- include "procure-platform.labels" (dict "root" $ "name" "network-policies") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        {{- range $callers }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
