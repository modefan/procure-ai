# procure-platform: the infrastructure of ProcureAI, as the AppHost runs it (images, tags, server arguments and memory settings equal
# src/AppHost/ProcureAi.AppHost: AppHost.cs and appsettings.json "Resources"). Environment values (hosts, sizes) come from the GitOps
# repo's envs/<env>/platform.yaml. Secrets are referenced by name only; bootstrap/new-secrets.ps1 in the GitOps repo creates them.

global:
  # Our own images (procure-ai-<name>, built by deploy/scripts/build-images.ps1 or CI): registry prefix ("" for images imported into
  # k3d with -ImportTo procure, ghcr.io/modefan once CI publishes) and tag (the full commit SHA, or local-<sha7> for PC builds). Required.
  imageRegistry: ""
  imageTag: ""
  # Per image (name without procure-ai-), overriding imageTag: the platform images postgres, keycloak and debezium are tagged by a hash
  # of their build context (infra/<name>), so a deploy that changes only app code does not restart them (plan 07 Task 6). The GitOps
  # repo's release.yaml sets them (platformImageTags).
  imageTags: {}
  imagePullPolicy: IfNotPresent
  # The GHCR pull Secret (plan 07 ruling 7); harmless for imported images.
  imagePullSecrets:
    - ghcr-pull

storageClassName: local-path
ingressClassName: traefik

hosts:
  # The app as the browser opens it (Keycloak's gateway redirect URIs and web origins: KC_APP_BASE_URL).
  app: procure.localtest.me
  # Keycloak; also the token issuer (https://<keycloak>/realms/procure) that pods reach through the CoreDNS rewrite (ruling 8).
  keycloak: auth.procure.localtest.me
  # The standalone Aspire dashboard (the aspire-dashboard client's redirect URI: KC_DASHBOARD_BASE_URL).
  dashboard: dashboard.procure.localtest.me
  mailpit: mail.procure.localtest.me
  # RabbitMQ's management UI for the operator (operatorAccess.rabbitmq; plan 08b Task 4). Empty: none.
  rabbitmq: ""

# Mirrors src/AppHost/ProcureAi.AppHost/appsettings.json "Resources" value for value (AppHost.Tests PlatformChartTests checks it).
# MemoryMb and Cpus are each container's limits (docker --memory / --cpus under the AppHost). Keep one flow mapping per line.
appHostResources:
  Postgres: { MemoryMb: 768, Cpus: 1, SharedBuffers: 128MB, WorkMem: 4MB, MaxConnections: 200, PoolSizePerService: 8, ReservedConnections: 30 }
  Mongo: { MemoryMb: 512, Cpus: 1, WiredTigerCacheGb: 0.25 }
  Keycloak: { MemoryMb: 768, Cpus: 1, JavaHeapOpts: "-Xms256m -Xmx512m" }
  Debezium: { MemoryMb: 512, Cpus: 0.3, JavaOpts: "-Xmx256m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -Xss512k -XX:MaxMetaspaceSize=128m" }
  RabbitMq: { MemoryMb: 384, Cpus: 1, VmMemoryHighWatermarkAbsolute: 256MiB }
  Redis: { MemoryMb: 192, Cpus: 1, MaxMemory: 128mb, MaxMemoryPolicy: volatile-ttl }
  Mailpit: { MemoryMb: 64, Cpus: 0.5 }

# Requests, from the limits above: the scheduler reserves this share of each memory limit and this much CPU per container, so the
# whole system fits the 10 GB k3d node (limits still cap each container exactly as the AppHost does).
requests:
  memoryPercent: 50
  cpu: 50m

# Small helper containers (the keyfile init container, the hook Jobs).
helperResources:
  limits: { memory: 128Mi, cpu: 500m }
  requests: { memory: 64Mi, cpu: 50m }
# mongosh (Node) in the mongo-init Job needs more than the other helpers.
mongoshResources:
  limits: { memory: 256Mi, cpu: 500m }
  requests: { memory: 128Mi, cpu: 50m }

postgres:
  image: procure-ai-postgres   # our image (infra/postgres): pgvector pg17 + pgaudit + initdb scripts
  user: postgres               # the superuser; its password is Secret procure-postgres (key password)
  storage: 5Gi
  # max_slot_wal_keep_size: the most WAL one replication slot may hold back. Past it Postgres invalidates the slot (Debezium then fails
  # loudly) instead of filling the volume above. Debezium's heartbeats keep idle slots far below it.
  maxSlotWalKeepSize: 1GB

mongo:
  image: docker.io/library/mongo:8.3
  replicaSet: rs0
  # How long mongod's init container waits for the member host `mongo` to resolve to the pod's own IP (after a restart DNS can lag).
  memberDnsWaitSeconds: 120
  storage: 2Gi

redis:
  image: docker.io/library/redis:8.6

rabbitmq:
  image: docker.io/library/rabbitmq:4.3-management
  storage: 1Gi
  # The topic exchange Debezium publishes changes to (ResourceNames.CdcExchange); declared by the rabbitmq-cdc-exchange hook Job.
  cdcExchange: cdc
  # The operator's own management login (plan 08b Task 4): the rabbitmq-cdc-exchange Job creates or updates this user with the password
  # from Secret procure-rabbitmq key `key` (when that key exists) on every sync. Not the apps' user: Dale signs in to the management UI
  # (operatorAccess.rabbitmq) with this one. Tags: administrator (users, policies, purge and move in an emergency).
  # { key: operator-password, user: operator, tags: administrator } in envs/<env>/platform.yaml; null: none.
  operator: null

keycloak:
  image: procure-ai-keycloak   # our image (infra/keycloak): kc.sh build --db=postgres --health-enabled=true, realm baked in
  database: keycloakdb         # role keycloak, created by infra/postgres/initdb/02-keycloak.sh
  dbUser: keycloak
  # Keycloak trusts X-Forwarded-* only from these (Traefik's pods; k3s pod CIDR). Only Traefik and Access may connect (networkPolicies).
  # Equal to procure-ai global.podCidr (the pod network the gateway and the service APIs trust).
  proxyTrustedAddresses: 10.42.0.0/16
  ingress:
    # true: the ingress routes only Keycloak's public paths /realms/<realm>/ for the realms below and /resources/ (plan 08 ruling 4: a
    # public host). The admin console, the admin REST API and the master realm (the admin's login and token endpoints) are then reached
    # inside the cluster only (Access on the Service; kcadm in the pod). false (local): every path.
    publicPathsOnly: false
    # The realms the public host serves when publicPathsOnly is on (the app's realm, and ops when Argo CD signs in there; never master).
    publicRealms: [procure]
    # With publicPathsOnly: also serve the admin console (/admin/) and the master realm (/realms/master/) on the public host (plan 08b
    # Task 4: Dale manages Keycloak from any browser). The master realm then asks for a one-time code at sign-in and locks out password
    # guessers for a while (keycloakConfig.masterRealm). Without publicPathsOnly (local) every path is served anyway.
    adminConsole: false
    # Per-client-address rate limits on Keycloak's host (templates/keycloak-ratelimit.yaml; plan 08 fix wave rulings R6b/R6c: slows
    # password guessing without a per-user lockout in the demo realm, which a stranger could use to keep the shared demo users locked).
    # Traefik RateLimit: `average` requests per `period`, bursts up to `burst`; over it, 429. Off by default (the local cluster); the
    # hosted values switch it on.
    rateLimit:
      enabled: false
      # EVERY path of the host (the keycloak Ingress itself carries it), so no spelling of a sign-in path (matrix parameters, encoded or
      # upper-case segments) can route around it. A sign-in page with its styles and scripts is about 20 requests; 120 a minute with
      # bursts of 60 lets a reviewer sign in and out as every demo role in a row.
      all: { average: 120, period: 1m, burst: 60 }
      # The token endpoints of publicRealms (exact prefix /realms/<realm>/protocol/openid-connect/token, their own Ingress and bucket).
      # Inside the cluster the gateway reaches them through Traefik too (CoreDNS rewrite), so the gateway pod is one source for every
      # visitor's code exchange, refresh and demo login (itself capped at 300 a minute): sized for all visitors together. Another
      # spelling of the path falls back to the stricter `all` bucket.
      token: { average: 600, period: 1m, burst: 120 }
  # Argo CD's address as the browser opens it (the argocd client's redirect URIs <url>/auth/callback and <url>/pkce/verify, web origin
  # and logout: KC_ARGOCD_BASE_URL, plan 08 Task 12c). Equal to configs.cm.url in the GitOps repo's envs/<env>/argocd.yaml. The default
  # is the hosted VM's (no ingress: the port-forward of bootstrap/hosted/open-argocd.ps1); local sets https://argocd.procure.localtest.me.
  argocdUrl: http://127.0.0.1:8080

# The keycloak-config Job (templates/keycloak-config-job.yaml, plan 08 ruling 7): keycloak-config-cli applies the realm file to the running
# Keycloak on every sync. Not under the AppHost (start-dev imports the realm at every start of its fresh container).
keycloakConfig:
  enabled: true
  # adorsys/keycloak-config-cli 6.5.1 built against Keycloak 26.5.5, the newest 26.x build published (none for 26.8 yet; the admin REST
  # API it uses is the same across 26.x, checked on the cluster against 26.8.1). Move to a <release>-26.8.x tag once there is one.
  image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5
  # How long it waits for Keycloak to answer before it fails.
  availabilityTimeout: 300s
  # The tool's own progress lines (which realm, which resources); never the realm content (see the template).
  logLevel: info
  javaOpts: "-Xms64m -Xmx192m -XX:+ExitOnOutOfMemoryError"
  resources:
    limits: { memory: 384Mi, cpu: "1" }
    requests: { memory: 192Mi, cpu: 50m }
  # import.<key> settings: what keycloak-config-cli may delete. Remote state (its record in realm attributes of what it imported) limits
  # every deletion to things it imported itself, never Keycloak's own (built-in clients and scopes, default roles). Organizations are not
  # covered by remote state and default to full management, which would remove members the file does not list: the users who registered
  # themselves and were added to `demo` by Access. no-delete keeps them (and any organization made outside the file).
  importSettings:
    remote-state.enabled: "true"
    managed.organization: no-delete
  # Environment variable of each ${KC_...} secret placeholder of the realm file -> its key in Secret procure-keycloak (as keycloak.yaml).
  secretPlaceholders:
    KC_DEMO_PASSWORD: demo-password
    KC_GATEWAY_SECRET: gateway-secret
    KC_INTERNAL_SECRET: internal-secret
    KC_ACCESS_ADMIN_SECRET: access-admin-secret
    KC_DEMO_LOGIN_SECRET: demo-login-secret
    KC_DASHBOARD_SECRET: dashboard-secret
  # Also apply files/keycloak-master-realm.json to the master realm (plan 08b Task 4): every password sign-in asks for a one-time code, in the
  # admin console (OTP Form REQUIRED, as in realm ops) and in a password grant (direct grant flow "operator direct grant", fix round 1), so no
  # master-realm account gets in with a password alone; password guessers are locked out for a while (temporary only, at most 15 minutes,
  # so a stranger cannot keep anyone out for long); no self-registration or password reset. Needs automationClient: the Job itself then
  # signs in as a client, which no user lockout or one-time code concerns.
  masterRealm:
    enabled: false
  # The automation's own confidential master-realm client (plan 08b Task 4 fix round 1, review I3/R3; files/keycloak-automation-client.sh):
  # keycloak-config-cli and the operator-user container sign in with client credentials (secret: Secret procure-keycloak key `secretKey`,
  # bootstrap/new-secrets.ps1), never with a password, so no brute-force lockout of a user can stop a sync. The Job's init container keeps
  # the client (service account only, master realm role admin), signing in as the bootstrap admin only while the client does not work yet
  # (fresh install, first sync after the change), and with disableBootstrapAdmin then disables the bootstrap admin (kept as break-glass:
  # procure-ai docs/hosting.md "Keycloak's automation client and the bootstrap admin"). null: the bootstrap admin's password, as before.
  # { clientId: procure-automation, secretKey: automation-client-secret, disableBootstrapAdmin: true } in envs/<env>/platform.yaml.
  automationClient: null
  # Dale's own master-realm admin (the Job's operator-user container, files/keycloak-operator-user.sh): Secret procure-keycloak keys; a
  # missing key skips it (the AppHost and older Secrets). null switches the container off.
  # { username: operator, passwordKey: operator-password, totpKey: operator-totp-base32 } in envs/<env>/platform.yaml.
  operatorUser: null

mailpit:
  image: docker.io/axllent/mailpit:v1.32.0
  ingress:
    # The web UI at https://<hosts.mailpit> (no login). false on a public host (plan 08 ruling 4): no Ingress, kubectl port-forward instead.
    enabled: true

debezium:
  image: procure-ai-debezium   # our image (infra/debezium): quay.io/debezium/server plus both properties files
  storage: 1Gi                 # the offsets (/debezium/data), one volume per instance
  # Heartbeats of the Postgres instances: every interval Debezium runs the action query in its database (the table is in the publication,
  # so an idle database still moves its replication slot). Same values as the AppHost (Debezium:HeartbeatIntervalMs; ChartDebeziumTests).
  heartbeatIntervalMs: 60000
  heartbeatActionQuery: UPDATE debezium_heartbeat SET beat_at = now() WHERE id = 1
  # What Debezium captures: the same as the AppHost's ServiceSpecs (CapturedTables), checked by AppHost.Tests ChartDebeziumTests.
  # One StatefulSet debezium-<database> per entry; each service's migration creates the publication dbz_publication with these tables.
  # Each replicates as its database's own role <service>_cdc (<service> = the database name without "db"; password: Secret
  # procure-db-roles, key <service>-cdc-password), which the db-roles Job creates.
  postgres:
    - { database: accessdb, tables: [permission_matrices, permission_grants, departments, cost_centers, tenant_users, system_settings, audit_entries] }
    - { database: budgetsdb, tables: [budgets, budget_reservations, budget_spends, audit_entries] }
    - { database: approvalsdb, tables: [approval_steps, audit_entries] }
    - { database: requestsdb, tables: [purchase_requests, request_lines, audit_entries] }
    - { database: purchasingdb, tables: [purchase_orders, order_lines, goods_receipts, receipt_lines, audit_entries] }
    - { database: assistantdb, tables: [policy_documents, audit_entries] }
    - { database: invoicingdb, tables: [invoices, invoice_lines, payments, payment_lines, audit_entries] }
  # The one debezium-mongo (none when the list is empty), over TLS as the least-privilege user the db-roles Job creates (infra/mongo/users.js:
  # read on the captured databases plus change streams; password: Secret procure-debezium, key mongo-password).
  mongo:
    collections: [suppliersdb.suppliers, assistantchatdb.conversations]
    user: debezium
    # Of the JKS truststore holding only the public local CA; not a secret (the JDK's default truststore password).
    truststorePassword: changeit

# The db-roles Job (templates/db-roles-job.yaml, plan 08 ruling 6): which passwords of Secret procure-db-roles reach the scripts.
dbRoles:
  # The Postgres services of infra/postgres/roles.sql: key <service>-password as DB_<SERVICE>_PASSWORD, and, for each database in
  # debezium.postgres, <service>-cdc-password as DB_<SERVICE>_CDC_PASSWORD (the role debezium-<service>db replicates as).
  postgresServices: [access, approvals, assistant, audit, budgets, invoicing, purchasing, requests]
  # The MongoDB users of infra/mongo/users.js (debezium's password comes from Secret procure-debezium, key mongo-password).
  mongoUsers:
    - { env: DB_SUPPLIERS_PASSWORD, key: suppliers-password }
    - { env: DB_ASSISTANT_MONGO_PASSWORD, key: assistant-mongo-password }

# The operator's read-only database users (plan 08b Task 4): what the web UIs of the procure-ops chart connect as by default (pgAdmin,
# the MongoDB UI, Redis Insight), so looking at the data cannot change it. Each is created only when its Secret key exists (optional
# secretKeyRefs; bootstrap/new-secrets.ps1 in the GitOps repo generates them), so the AppHost and an older Secret simply get none. Empty
# a key here to switch that user off entirely. Off by default (no key, no user; a Secret key is never optional): the GitOps repo's
# envs/<env>/platform.yaml switches them on once bootstrap/new-secrets.ps1 created the keys.
operatorReaders:
  # Postgres role operator_reader (infra/postgres/roles.sql): SELECT on the service databases' tables (not pg_read_all_data, which reads
  # pg_authid too), CONNECT on every database but keycloakdb; Secret procure-db-roles key
  # (operator-reader-postgres-password).
  postgresKey: ""
  # MongoDB user operator_reader (infra/mongo/users.js): read on every app database; Secret procure-db-roles key
  # (operator-reader-mongo-password).
  mongoKey: ""
  # Redis ACL user (templates/redis.yaml); Secret procure-redis key. `commands` follows `-@all`: every read command but KEYS (it blocks the
  # server), and what Redis Insight asks about the connection and the server. Nothing that writes, deletes or changes the server.
  # key: in Secret procure-redis (operator-reader-password); empty: no such user.
  # keys: the key families it may read (ACL key patterns), an allow-list on purpose (plan 08b Task 4 fix round 1 I1): never procure:bff:*,
  # the gateway's Data Protection key ring and the session and tenant-switch tickets (with the key ring anyone could forge a session for
  # any signed-in user; the chart fails on a pattern that matches them). A new key family is added here on purpose. SCAN still lists every
  # key NAME (an ACL cannot filter it); the names of the gateway's keys hold no secret (a session cookie is encrypted with the key ring).
  #   v2:*            FusionCache (every service's 1 s GET cache, idempotency records, access lookups)
  #   ProcureAi.*     DistributedLock's locks (<service>:lock:...)
  #   email:* bell:*  Notifications (sent e-mails, the bell inbox); presence:* SignalR presence
  #   assistant:*     the Assistant's answer locks, question quotas and token budgets
  #   procure:status:* procure:stats:* procure:maintenance  the system status page, daily stats, the maintenance window
  redis:
    key: ""
    user: operator_reader
    keys: ["v2:*", "ProcureAi.*", "email:*", "bell:*", "presence:*", "assistant:*", "procure:status:*", "procure:stats:*", "procure:maintenance"]
    commands: "+@read -keys +info +ping +select +hello +command +client|setname +client|getname +client|id +client|info +client|no-touch"

# The operator's direct access (templates/operator-access.yaml, plan 08b Task 4): each component on its own address with its own login,
# not behind Keycloak or the gateway, so Dale can look when parts of the site are down.
operatorAccess:
  # The namespace of the procure-ops chart (pgAdmin, the MongoDB UI, Redis Insight).
  namespace: operator
  # store (pod label app.kubernetes.io/name here) -> the operator tool (pod label app.kubernetes.io/name in `namespace`) that may reach it on
  # storePorts.<store>. Empty: no operator tool reaches a store.
  tools: {}
  storePorts:
    postgres: 5432
    mongo: 27017
    redis: 6379
  # RabbitMQ's management UI at https://<hosts.rabbitmq> (its own login, the user rabbitmq.operator).
  rabbitmq:
    enabled: false
  # Per client address on the operator hosts (Traefik RateLimit, as keycloak.ingress.rateLimit): a management UI page is a few dozen
  # requests and polls every few seconds; a password guesser gets about one try a second.
  rateLimit: { average: 300, period: 1m, burst: 100 }
  # Traefik Headers middleware: no framing by other sites, no MIME sniffing, no referrer, no search engine.
  headers:
    customFrameOptionsValue: SAMEORIGIN
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"

curl:
  # Runs the rabbitmq-cdc-exchange Job (the management API PUT that CdcExchangeHealthCheck does under the AppHost).
  image: docker.io/curlimages/curl:8.23.0

networkPolicies:
  enabled: true
  # Pods that trust X-Forwarded-* from the whole pod network (the gateway: ForwardedHeaders__KnownNetworks__0; Keycloak:
  # keycloak.proxyTrustedAddresses). Any pod that can connect to them could claim any client address (rate limits, audit, Keycloak's
  # brute-force detection), so the namespace-wide rule leaves them out and only Traefik (kube-system) plus the callers listed here
  # (pod labels in namespace procure) reach their http port (plan 08 ruling 5). Kubelet probes come from the node and are not affected.
  # Not listed, on purpose: the service APIs. They trust the pod network (procure-ai global.podCidr) for X-Forwarded-Proto only (their
  # ForwardedHeaders:Headers), never for a client address, so any pod may keep calling them; a policy here would cut service-to-service calls.
  forwardedHeaderTrusting:
    # The demo seed and the nightly reset (procure-ai templates/demo-data.yaml) call the gateway's Service with the admin key.
    gateway:
      - { app.kubernetes.io/component: demo-data }
    # Access calls the Keycloak admin REST API on the Service (Keycloak__AdminBaseUrl), which the public ingress may not route.
    # The keycloak-config Job applies the realm file through the admin REST API on the Service (plan 08 ruling 7).
    keycloak:
      - { app.kubernetes.io/name: access-api }
      - { app.kubernetes.io/name: keycloak-config }
