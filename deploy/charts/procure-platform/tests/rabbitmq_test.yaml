suite: rabbitmq
templates:
  - rabbitmq.yaml
set:
  global.imageTag: abc1234
tests:
  # Like mongo-init: a Sync hook in wave 1 (after rabbitmq, before Debezium in wave 2), no Helm hook, renamed per Helm revision.
  - it: cdc exchange job does not wait for the apps
    release:
      revision: 4
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: rabbitmq-cdc-exchange-4
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      # As CdcExchangeHealthCheck does: PUT the durable topic exchange through the management API (idempotent; 406 on a mismatch).
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "-X PUT"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "http://rabbitmq:15672/api/exchanges/%2F/cdc"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\{"type":"topic","durable":true,"auto_delete":false,"internal":false\}'

  - it: rabbitmq creates its user from the procure-rabbitmq secret with the AppHost's memory watermark
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/rabbitmq:4.3-management
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: procure-rabbitmq
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: procure-rabbitmq
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
            value: '-rabbit vm_memory_high_watermark {absolute,"256MiB"}'
  - it: the cdc exchange job escapes the credentials for the curl config
    documentSelector:
      path: kind
      value: Job
    asserts:
      # Inside a quoted curl config string \ and " are special; both are escaped before the user line is written (no argv secrets).
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'admin\(\) \{ printf ''user = "%s:%s"\\n'' "\$\(esc "\$ADMIN_USER"\)" "\$\(esc "\$ADMIN_PASSWORD"\)"; \}'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'whoami_status\(\) \{ printf ''user = "%s:%s"\\n'' "\$\(esc "\$1"\)" "\$\(esc "\$2"\)" \| curl --config -'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'admin \| curl --config -'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'esc\(\) \{ printf ''%s'' "\$1" \| sed ''s/\[\\\\"\]/\\\\&/g''; \}'

  # Fix round 2 (review I5): when no user signs in to the management API (a new operator password not yet in RabbitMQ, while the apps'
  # user has no tags), the Job stops at once with the recovery step instead of retrying a 401; other failures are still retried.
  - it: the cdc exchange job fails at once with the recovery step when no user signs in
    set:
      rabbitmq.operator: { key: operator-password, user: operator, tags: administrator }
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.backoffLimit
          value: 6
      - equal:
          path: spec.podFailurePolicy.rules[0]
          value:
            action: FailJob
            onExitCodes:
              containerName: declare-exchange
              operator: In
              values: [3]
      - equal:
          path: spec.template.spec.containers[0].name
          value: declare-exchange
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[ "\$ADMIN_STATUS" = 401 \] && \{ \[ "\$OP_STATUS" = none \] \|\| \[ "\$OP_STATUS" = 401 \]; \}; then'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "neither 'operator' \\(Secret procure-rabbitmq key operator-password\\) nor the apps' user \\$RABBITMQ_USER signs in \\(401\\)"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'kubectl -n procure exec -i rabbitmq-0 -- rabbitmqctl change_password operator   \(the new value on stdin\), then sync again'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)= 401 \]; \}; then.*exit 3\n\s*fi\n\s*if \[ "\$ADMIN_STATUS" != 200 \]; then\n[^\n]*\n\s*exit 1\n\s*fi\n\s*echo "management API as \$ADMIN_USER"'
  # Fix round 3 (review m8): a timeout (000) or 5xx from the operator's whoami is not a refused login: the operator status is kept,
  # the operator is chosen only on 200, and any non-200 that is not a double 401 exits 1 (retried), never 3.
  - it: the cdc exchange job retries a transient whoami failure instead of failing at once
    set:
      rabbitmq.operator: { key: operator-password, user: operator, tags: administrator }
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'OP_STATUS=\$\(whoami_status ''operator'' "\$OPERATOR_PASSWORD"\)\n\s*if \[ "\$OP_STATUS" = 200 \]; then ADMIN_USER=''operator''; ADMIN_PASSWORD="\$OPERATOR_PASSWORD"; fi'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[ "\$OP_STATUS" = 200 \]; then ADMIN_STATUS=200; else ADMIN_STATUS=\$\(whoami_status "\$ADMIN_USER" "\$ADMIN_PASSWORD"\); fi'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'answered \$ADMIN_STATUS as \$ADMIN_USER \(Dale''s management user: \$OP_STATUS\); not a refused login, retried with a new pod\." >&2\n\s*exit 1'
  - it: without an operator user the early exit names the apps' user only
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "the apps' user \\$RABBITMQ_USER cannot call the management API \\(401"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: change_password
