suite: mongo
templates:
  - mongo.yaml
set:
  global.imageTag: abc1234
tests:
  - it: mongo requires TLS and uses the keyfile
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/mongo:8.3
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --bind_ip_all
            - --replSet
            - rs0
            - --keyFile
            - /etc/mongo-keyfile/keyfile
            - --tlsMode
            - requireTLS
            - --tlsCertificateKeyFile
            - /etc/mongo-tls/mongo.pem
            - --tlsCAFile
            - /etc/procure-ca/ca.crt
            - --tlsAllowConnectionsWithoutCertificates
            - --wiredTigerCacheSizeGB
            - "0.25"
      # MongoDB 8 starts on Linux kernel 6.19+ only with glibc keeping rseq (SERVER-121912).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GLIBC_TUNABLES
            value: glibc.pthread.rseq=1
      # The keyfile comes from the Secret through an init container that makes it owner-read-only (mongod refuses a group-readable one).
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: keyfile
      # Re-runnable in the same pod (a recreated sandbox reruns init containers on the kept Memory emptyDir): the 0400 copy is removed
      # before it is copied again, since a non-root user without capabilities cannot overwrite it.
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: '^rm -f /etc/mongo-keyfile/keyfile && cp /etc/mongo-keyfile-secret/keyfile /etc/mongo-keyfile/keyfile && chmod 0400 /etc/mongo-keyfile/keyfile$'
      - contains:
          path: spec.template.spec.volumes
          content:
            name: keyfile-secret
            secret:
              secretName: procure-mongo
              items:
                - key: keyfile
                  path: keyfile
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: mongo-tls
              items:
                - key: mongo.pem
                  path: mongo.pem
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: procure-mongo
                key: password

  # Platform bootstrap must not wait for the apps (fresh-install deadlock, Task 5 fix round 2): an Argo CD Sync hook in wave 1, right
  # after mongo (wave 0) is up and before Debezium (wave 2); no Helm hook, so `helm upgrade --install --wait` runs it as a plain Job
  # at once. The release revision in its name makes Helm run it again on every upgrade (a Job's spec cannot change in place).
  - it: the replica set is initiated by an idempotent job that does not wait for the apps
    release:
      revision: 4
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: mongo-init-4
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: replSetGetStatus
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "rs.initiate\\(\\{ _id: 'rs0'"

  - it: the mongo service resolves to the member itself
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  # Regression (Task 4 fix round 1): after a cluster restart mongo-0 came up REMOVED because `mongo` did not resolve to the new pod IP yet,
  # and TCP probes reported the stuck member Ready.
  - it: mongod starts only once the member host resolves to the pod itself
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-member-dns
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'getent ahostsv4 mongo .*\n *if \[ "\$ips" = "\$POD_IP " \]; then .* exit 0; fi'
      # Bounded: it gives up (and the pod is retried) instead of waiting forever.
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'for i in \$\(seq 1 120\); do[\s\S]*exit 1\s*$'

  - it: a stuck replica set member is neither started nor ready
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: 'replSetGetStatus.*s\.code === 94.*s\.myState === 1 \|\| s\.myState === 2'
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'replSetGetStatus.*s\.code === 94.*s\.myState === 1 \|\| s\.myState === 2'
      # Over TLS, with the root credentials from the environment, never on the command line.
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'tls=true&tlsCAFile=/etc/procure-ca/ca\.crt.*admin\.auth\(process\.env\.MONGO_INITDB_ROOT_USERNAME, process\.env\.MONGO_INITDB_ROOT_PASSWORD\)'
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: '--password|-p '
