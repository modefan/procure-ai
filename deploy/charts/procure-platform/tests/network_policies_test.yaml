suite: network policies
templates:
  - network-policies.yaml
set:
  global.imageTag: abc1234
tests:
  - it: default deny network policy exists
    documentSelector:
      path: metadata.name
      value: default-deny-ingress
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector
          value: {}
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - notExists:
          path: spec.ingress

  - it: pods of the namespace may reach each other, and nothing else is allowed in by it
    documentSelector:
      path: metadata.name
      value: allow-same-namespace
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}

  - it: traefik reaches only the http port of ingress backends
    documentSelector:
      path: metadata.name
      value: allow-traefik-to-ingress-backends
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              procure.ai/ingress-backend: "true"
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
              ports:
                - port: http
                  protocol: TCP

  - it: nothing outside the namespace but traefik is allowed in (observability gets nothing)
    asserts:
      - notExists:
          path: $..namespaceSelector.matchLabels[?(@ == "observability")]
      - notExists:
          path: spec.ingress[?(@.from[0].ipBlock)]

  # Plan 08 ruling 5: the gateway and Keycloak trust X-Forwarded-* from the pod network, so only Traefik (and the in-cluster callers
  # that need them directly) may connect to them; any other pod could otherwise claim any client IP.
  - it: only traefik reaches the gateway and keycloak http ports
    asserts:
      # The namespace-wide rule leaves them out ...
      - equal:
          path: spec.podSelector
          value:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: NotIn
                values: [gateway, keycloak]
        documentSelector: { path: metadata.name, value: allow-same-namespace }
      # ... and each gets its own: Traefik plus its named direct callers, on the http port only.
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: gateway
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: traefik
                  - podSelector:
                      matchLabels:
                        app.kubernetes.io/component: demo-data
                ports:
                  - port: http
                    protocol: TCP
        documentSelector: { path: metadata.name, value: allow-direct-callers-gateway }
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: keycloak
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: traefik
                  - podSelector:
                      matchLabels:
                        app.kubernetes.io/name: access-api
                  # The keycloak-config Job (plan 08 ruling 7) applies the realm through the admin REST API on the Service.
                  - podSelector:
                      matchLabels:
                        app.kubernetes.io/name: keycloak-config
                ports:
                  - port: http
                    protocol: TCP
        documentSelector: { path: metadata.name, value: allow-direct-callers-keycloak }
