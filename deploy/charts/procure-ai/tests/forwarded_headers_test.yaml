# Plan 08b Task 2: Swagger UI on https. Every service API trusts the pod network (the gateway behind Traefik) for X-Forwarded-Proto, so
# its OpenAPI document names https://<app host>/; without it the document said http:// and the browser blocked "Try it out" as mixed
# content. Which headers a service takes (the scheme only) is its appsettings.json (ForwardedHeaders:Headers), not the chart.
suite: forwarded headers
set:
  global.imageTag: abc1234
tests:
  - it: access-api trusts the pod network for the forwarded scheme
    template: charts/access/templates/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ForwardedHeaders__KnownNetworks__0
            value: 10.42.0.0/16
  - it: approvals-api trusts the pod network for the forwarded scheme
    template: charts/approvals/templates/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
