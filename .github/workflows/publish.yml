name: publish

# After CI passed for a push to main: build the images, push them to GitHub Container Registry, then deploy the commit by setting
# appRevision (and the platform image tags) in the GitOps repo (modefan/procure-ai-gitops envs/local/release.yaml and, since plan 08
# Task 12, envs/hosted/release.yaml: the public demo follows main too). Argo CD sees the bump within a few minutes and syncs: migrations
# first, then the new pods (plan 07 Task 6, rulings 1, 4 and 6).
#   App images (the .NET apps, web, demo-data): tag = the commit's full SHA.
#   Platform images (postgres, keycloak, debezium, built from infra/<name>): tag = the git tree hash of infra/<name>, built and pushed only
#   when GHCR does not have that tag yet, so a deploy that changes only app code does not restart Postgres, Keycloak or Debezium.
# Credentials: GITHUB_TOKEN (packages: write) in the build job; the GitOps repo's write deploy key only in the deploy job, from the
# Environment `gitops` (deployment branch: main only; created by the GitOps repo's bootstrap/install-argocd.ps1). Third-party actions are
# pinned by commit SHA.

# Dale 2026-11-13: build and deploy in under 10 minutes, so this no longer waits for CI: it starts on every push to main (docs-only
# pushes skipped, like CI). CI runs alongside it and still reports, but a red CI no longer stops a deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The pushed commit.
  REVISION: ${{ github.sha }}

jobs:
  images:
    name: Build and push the images
    # Only a green CI run of a push to main of this repository (never a pull request or a fork's branch that happens to be called main).
    if: github.ref == 'refs/heads/main' && github.repository == 'modefan/procure-ai'
    # At job level, so a skipped run (a failed or cancelled CI) never cancels the publish of a tested commit. A newer tested commit
    # cancels an older one's image build: its images would be replaced at once.
    concurrency:
      group: publish-images
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      platform-tags: ${{ steps.push.outputs.platform-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Registry name (lower case)
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "REGISTRY=ghcr.io/${OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image of deploy/scripts/build-images.ps1, labelled with this repository as its source, so GHCR links each package to
      # procure-ai (and this repository's GITHUB_TOKEN may push and prune it).
      - name: Build and push
        id: push
        shell: pwsh
        run: |
          $tags = Join-Path $env:RUNNER_TEMP 'platform-tags.json'
          ./deploy/scripts/build-images.ps1 -Tag $env:REVISION -Registry $env:REGISTRY -Push -ContentTagPlatform -SkipExisting -TagsFile $tags
          "platform-tags=$((Get-Content -Raw $tags | ConvertFrom-Json | ConvertTo-Json -Compress))" >> $env:GITHUB_OUTPUT

  deploy:
    name: Deploy (set the release in the GitOps repo)
    needs: images
    # Deploys run one after another and never cancel each other; the bump itself refuses to move backwards.
    concurrency:
      group: publish-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GITOPS_DEPLOY_KEY lives in this Environment, which only the main branch may use.
    environment: gitops
    permissions:
      contents: read
    steps:
      # This repository's history, for the never-move-backwards check. No build code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: app

      - name: Check out the GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/procure-ai-gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Set appRevision and the platform image tags
        working-directory: gitops
        env:
          PLATFORM_TAGS: ${{ needs.images.outputs.platform-tags }}
          # Every environment that follows main: the local k3d cluster and the public hosted VM (plan 08 Task 12). Each file is bumped on
          # its own (an environment pinned to a newer revision by hand is never moved back); one commit for all.
          GITOPS_ENVS: local hosted
        run: |
          set -euo pipefail
          short="${REVISION:0:7}"
          for name in postgres keycloak debezium; do
            tag="$(jq -r --arg n "$name" '.[$n] // empty' <<< "$PLATFORM_TAGS")"
            [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no platform tag for $name in '$PLATFORM_TAGS'"; exit 1; }
          done
          git config user.name "procure-ai publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            bumped=()
            summary=()
            for env in $GITOPS_ENVS; do
              file="envs/${env}/release.yaml"
              [ -f "$file" ] || { echo "::error::$file does not exist"; exit 1; }
              current="$(yq -r '.appRevision // ""' "$file")"
              if [ "$current" = "$REVISION" ]; then
                echo "${env}: appRevision is already $REVISION."
                continue
              fi
              # Never move backwards: skip when this commit is an ancestor of the deployed one (a newer run already deployed).
              if [ -n "$current" ] && git -C ../app merge-base --is-ancestor "$REVISION" "$current" 2>/dev/null; then
                echo "::notice::${env}: deployed revision $current is newer than $REVISION; left as it is."
                continue
              fi
              # Quoted strings: a SHA made of digits only would otherwise be read as a number.
              REVISION="$REVISION" PLATFORM_TAGS="$PLATFORM_TAGS" yq -i '
                .appRevision = strenv(REVISION) | .appRevision style="double" |
                .platformImageTags = (strenv(PLATFORM_TAGS) | from_json) | .platformImageTags style="" | (.platformImageTags[] | key) style="" | .platformImageTags[] style="double"' "$file"
              [ "$(yq -r '.appRevision' "$file")" = "$REVISION" ]
              bumped+=("$env")
              summary+=("${env}: appRevision ${current:-<none>} -> ${REVISION}")
            done
            if [ "${#bumped[@]}" -eq 0 ]; then
              echo "Nothing to deploy: every environment is at $REVISION or newer."
              exit 0
            fi
            git commit -q -am "Deploy procure-ai ${short} to ${bumped[*]}" \
              -m "procure-ai ${REVISION}; platform images ${PLATFORM_TAGS} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            if git push -q origin HEAD:main; then
              {
                echo "### Deployed procure-ai ${short} to ${bumped[*]}"
                printf '%s\n' "${summary[@]}"
                echo "platform image tags ${PLATFORM_TAGS}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Someone pushed to the GitOps repo meanwhile: start again from its newest main.
            echo "::warning::push to the GitOps repo was rejected (attempt ${attempt}); retrying on its newest main"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error::could not push the release bump to the GitOps repo"
          exit 1
