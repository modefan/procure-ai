name: CI

# Which suites run when: the PUBLIC-REPO setting (plan 08c Task 2, go-public; public repos have unlimited standard-runner minutes and
# the 4-CPU, 16 GB runner). Every push to main that changes more than docs (paths-ignore below; publish.yml follows CI, so a docs-only
# push publishes nothing either), the weekly run (schedule, skipped when main has not moved since the last weekly run) and a hand-started
# run (workflow_dispatch, any branch) run the build, warnings as errors, client and generated-code drift, the fast suites (unit and
# architecture tests, the Angular specs, the chart checks) and the long suites (the container image builds and image tests, the
# Testcontainers integration tests, the AppHost tests). The system and Playwright end-to-end tests run ONLY in a hand-started run
# (E2E-PUSH-OFF / E2E-DISPATCH-ONLY below). A hand-started run can be narrowed with the `only` input, or run only the fast suites with
# `profile: push`.
# E2E-PUSH-OFF, E2E-DISPATCH-ONLY (plan 08c Task 2 ruling, narrowed by the plan 08c final review I2): the system and end-to-end job is run
# by hand only (Actions -> CI -> Run workflow), neither on push nor weekly, until the whole AppHost stack fits the 16 GB runner: it was
# killed ("The runner has received a shutdown signal") in 2 of 4 push runs, and hung with an extra swap file. Its memory log names the
# biggest processes for that fix. The weekly run keeps the other jobs (it catches new NuGet advisories without a push).
# Until go-public the long suites and the end-to-end job were weekly or off (plan 08 ruling 14, Dale's minutes decision 2026-11-06,
# E2E-OFF); measured minutes and the arithmetic: docs/testing.md and the plan 08 Task 14 report.
# publish.yml only follows a green CI run of a *push* to main, so a weekly or hand-started run never publishes or deploys anything.

on:
  push:
    branches: [main]
    # Docs-only pushes run no CI (and therefore no publish). Only the root *.md files ("*" never crosses "/"): Markdown elsewhere can be
    # app content (infra/seed policy documents, test fixtures) and must still be built, tested and published.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "full: everything, as a push or the weekly run (default). push: only the fast suites (no long suites)."
        type: choice
        options: [full, push]
        default: full
      only:
        description: >-
          Run only these .NET test projects (space-separated names, e.g. ProcureAi.Suppliers.IntegrationTests). Empty: all of them.
          ("e2e" selects the system and end-to-end tests.)
        type: string
        default: ""
  schedule:
    # Sundays 00:00 UTC (02:00 in Johannesburg).
    - cron: "0 0 * * 0"

concurrency:
  # One group per ref and event: a newer push cancels an older push's run, but never a running weekly (schedule) or hand-started
  # (workflow_dispatch) run, and those two never cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # "true": run the long suites too (every push, weekly and by hand); "false" only for a hand-started `profile: push`.
  FULL: ${{ inputs.profile != 'push' }}

jobs:
  weekly-gate:
    # Only for the weekly run: skip everything when main has not moved since the commit the last weekly run tested, or moved only by docs
    # (the same paths push ignores), so a quiet week costs one minute instead of a full run. Fails CLOSED: if GitHub cannot be asked,
    # the week is skipped with an error annotation (a weekly run is cheap to start by hand; an unwanted one is not). A push never runs
    # this job, so it adds nothing to a push's minutes.
    name: Weekly gate (skip if main has not moved)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # The commit of the newest earlier weekly run that actually RAN the suites (its .NET job was not skipped or cancelled). A week the
          # gate skipped (main unchanged, docs only, or a fail-closed skip) does not count, so code that arrived before a fail-closed
          # skip is still compared, and tested, the next week.
          if ! runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --branch main -L 20 \
              --json databaseId,headSha --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | \"\(.databaseId) \(.headSha)\"")"; then
            echo "::error::Could not list the earlier weekly runs; skipping this week (fail closed). Start the full run by hand if needed."
            skip "skipped: gh run list failed"
          fi
          last=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            if ! ran="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name | startswith("Build and test")) | .conclusion] | first // ""')"; then
              echo "::error::Could not read the jobs of weekly run $id; skipping this week (fail closed)."
              skip "skipped: gh api jobs failed"
            fi
            case "$ran" in success|failure|timed_out) last="$sha"; break ;; esac
          done <<< "$runs"
          if [ -z "$last" ]; then
            echo "No earlier weekly run ran the suites: running them."; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then skip "main is still at $GITHUB_SHA, tested by the last weekly run: skipping."; fi
          # Files changed since then. The compare API returns at most 300 files in all; 300 or more counts as code.
          if ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA?per_page=100" --jq '.files[].filename')"; then
            echo "::error::Could not compare $last...$GITHUB_SHA; skipping this week (fail closed). Start the full run by hand if needed."
            skip "skipped: compare failed"
          fi
          files="$(printf '%s\n' "$files" | sort -u)"
          total="$(printf '%s\n' "$files" | grep -c . || true)"
          code="$(printf '%s\n' "$files" | grep -v -E '^[^/]*\.md$|^docs/|^\.github/ISSUE_TEMPLATE/' | grep -c . || true)"
          if [ "$code" -eq 0 ] && [ "$total" -lt 300 ]; then
            skip "main moved from $last to $GITHUB_SHA by docs only: skipping."
          fi
          echo "main moved from $last to $GITHUB_SHA ($code code files): running the full suites."
          echo "skip=false" >> "$GITHUB_OUTPUT"

  dotnet:
    name: Build and test (.NET)
    needs: [weekly-gate]
    if: ${{ !cancelled() && needs.weekly-gate.result != 'failure' && needs.weekly-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Docker Hub login (avoids pull rate limits)
        if: env.FULL == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trust the ASP.NET Core dev certificate (the Aspire gateway health check uses HTTPS)
        if: env.FULL == 'true'
        run: |
          # Exit code 4 only means "not trusted system-wide"; the OpenSSL trust directory below is what .NET uses on Linux.
          dotnet dev-certs https --trust || true
          ls "$HOME/.aspnet/dev-certs/trust"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # The AppHost infrastructure test starts the AppHost, whose web-installer runs npm install (package.json engines, engine-strict).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.FULL == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Web/procure-ai-web/package-lock.json

      - uses: ./.github/actions/ci-secrets

      - name: Build
        run: dotnet build ProcureAi.slnx -c Release -warnaserror -m:4

      # One project at a time: the container-based suites must never run concurrently.
      # Safety nets: every project gets its own test timeout (MTP --timeout), so a hang fails that project by name
      # instead of silently using up the job timeout; the step itself is bounded below the job timeout.
      # Long suites: every *.IntegrationTests project, the projects in LONG below (containers) and ProcureAi.AppHost.Tests (its
      # infrastructure test starts the AppHost; its model tests take about four minutes); they run only when FULL is true.
      - name: Test
        shell: bash
        timeout-minutes: 50
        env:
          LONG: ProcureAi.BuildingBlocks.Tests
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          status=0
          summary=""
          for project in tests/*/; do
            name="$(basename "$project")"
            # Only test projects (*Tests); shared libraries such as ProcureAi.Testing have no tests.
            case "$name" in *Tests) ;; *) continue ;; esac
            # The end-to-end projects start the whole AppHost; they run in the e2e job instead.
            if [ "$name" = "ProcureAi.EndToEndTests" ] || [ "$name" = "ProcureAi.SystemTests" ]; then continue; fi
            long=false
            case "$name" in *.IntegrationTests|ProcureAi.AppHost.Tests) long=true ;; esac
            for l in $LONG; do [ "$name" = "$l" ] && long=true; done
            if [ -n "$ONLY" ] && ! printf ' %s ' "$ONLY" | grep -q " $name "; then continue; fi
            if [ "$long" = true ] && [ "$FULL" != true ]; then
              summary+="$name: not run (long suite; profile push)"$'\n'
              continue
            fi
            filter=()
            # The chart parity classes run in the charts job (helm and the GitOps repo are there); everything else of the AppHost tests here.
            if [ "$name" = "ProcureAi.AppHost.Tests" ]; then
              filter=(--filter-not-class ProcureAi.AppHost.Tests.ChartParityTests --filter-not-class ProcureAi.AppHost.Tests.PlatformChartTests
                --filter-not-class ProcureAi.AppHost.Tests.ChartDebeziumTests)
            fi
            echo "::group::$name"
            start=$SECONDS
            result=passed
            dotnet test --project "$project" -c Release --no-build --timeout 12m "${filter[@]}" \
              --report-xunit-trx --results-directory "$RUNNER_TEMP/trx" || { status=1; result=FAILED; }
            echo "::endgroup::"
            line="$name: $result in $((SECONDS - start)) s"
            echo "$line"
            if [ "$result" = FAILED ]; then echo "::error::$line"; fi
            summary+="$line"$'\n'
          done
          printf '### .NET test projects\n\n```\n%s```\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: ${{ runner.temp }}/trx
          if-no-files-found: ignore

  web:
    name: Angular build, test and client drift
    needs: [weekly-gate]
    if: ${{ !cancelled() && needs.weekly-gate.result != 'failure' && needs.weekly-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Web/procure-ai-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Web/procure-ai-web/package-lock.json

      # .NET is needed only to regenerate the OpenAPI documents (each is written when its API project is built).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

      # Every Api project writes its openapi/<name>-v1.json when built, and WriteGeneratedCode rewrites its pre-generated Wolverine code
      # (Internal/Generated, run by the images in Static mode: docs/generated-code.md). The list is discovered, so a new service is
      # covered at once.
      - name: Regenerate OpenAPI documents, API client and Wolverine code
        run: |
          for api in ../../Services/*/ProcureAi.*.Api; do
            dotnet build "$api" -c Release -m:4 "-t:Build;WriteGeneratedCode"
          done
          npm run generate:api

      - name: Fail on client or generated-code drift
        working-directory: .
        run: |
          paths="$(find src/Services -type d \( -path '*.Api/openapi' -o -path '*.Api/Internal/Generated' \) | sort | xargs) src/Web/procure-ai-web/src/app/api"
          echo "Checking: $paths"
          # Guard against the discovery silently finding nothing: every Api project must have written exactly one document.
          apis="$(find src/Services -maxdepth 2 -type d -name 'ProcureAi.*.Api' | wc -l)"
          docs="$(find src/Services -path '*.Api/openapi/*-v1.json' | wc -l)"
          if [ "$apis" -eq 0 ] || [ "$apis" -ne "$docs" ]; then echo "::error::Found $apis Api projects but $docs OpenAPI documents."; exit 1; fi
          # ... and every Api project must have non-empty generated Wolverine code.
          for api in $(find src/Services -maxdepth 2 -type d -name 'ProcureAi.*.Api' | sort); do
            if [ -z "$(find "$api/Internal/Generated" -name '*.cs' 2>/dev/null | head -1)" ]; then
              echo "::error::$api has no generated Wolverine code in Internal/Generated."; exit 1
            fi
          done
          # git status also lists new untracked files, which git diff would miss.
          drift="$(git status --porcelain -- $paths)"
          if [ -n "$drift" ]; then
            echo "::error::Generated OpenAPI document, API client or Wolverine code differs from what is committed. Regenerate and commit (docs/generated-code.md)."
            echo "$drift"
            git diff -- $paths | head -200
            exit 1
          fi

  charts:
    # Chart checks (plan 07 ruling 9) and the AppHost's chart parity guards (ChartParityTests, PlatformChartTests, ChartDebeziumTests;
    # plan 07 final review M3): no containers, every push. Tool versions pinned as on the PC
    # (plan 07 Task 2). The GitOps repo is checked out next to this one (procure-ai-gitops beside procure-ai, as on the PC), so the
    # parity tests also render the umbrella with envs/local/ and envs/hosted/procure-ai.yaml. The GitOps repo is public, so it is read
    # without a key (plan 08c final review M4; the old read-only deploy key GITOPS_READ_KEY_CI is removed after one green run).
    name: Helm charts and chart parity
    needs: [weekly-gate]
    if: ${{ !cancelled() && needs.weekly-gate.result != 'failure' && needs.weekly-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HELM_VERSION: v3.20.0
      HELM_UNITTEST_VERSION: v1.2.1
      KUBECONFORM_VERSION: v0.8.0
    defaults:
      run:
        working-directory: procure-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: procure-ai

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/procure-ai-gitops
          persist-credentials: false
          path: procure-ai-gitops

      - name: Install Helm, helm-unittest and kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          helm version --short && helm unittest --help > /dev/null && kubeconform -v

      - name: Build the charts' dependencies
        run: |
          set -euo pipefail
          helm dependency build deploy/charts/procure-ai --skip-refresh
          # The observability chart depends on the official collector chart (version and digest pinned in its Chart.lock). Its archive is
          # committed (Argo CD renders without downloading it, plan 08 fix wave); the build downloads the release again and the diff
          # proves the committed archive is byte for byte the published one.
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build deploy/charts/procure-observability
          git diff --exit-code -- deploy/charts/procure-observability/charts
          test -z "$(git status --porcelain -- deploy/charts/procure-observability/charts)"

      - name: helm lint
        run: |
          set -euo pipefail
          helm lint deploy/charts/procure-platform --set global.imageTag=ci
          helm lint deploy/charts/procure-app --set global.imageTag=ci --set name=ci-api --set image.repository=procure-ai-ci
          helm lint deploy/charts/procure-ai --set global.imageTag=ci --set global.demo.seed=true --set global.demo.reset=true
          helm lint deploy/charts/procure-observability
          helm lint deploy/charts/procure-ops

      - name: helm unittest
        run: >-
          helm unittest deploy/charts/procure-platform deploy/charts/procure-app deploy/charts/procure-ai
          deploy/charts/procure-observability deploy/charts/procure-ops

      - name: Collector log redaction (pinned collector image over sample logs)
        shell: pwsh
        run: ./deploy/charts/procure-observability/tests/collector/Test-CollectorRedaction.ps1

      - name: kubeconform -strict
        run: |
          set -euo pipefail
          helm template procure-platform deploy/charts/procure-platform --namespace procure --set global.imageTag=ci \
            | kubeconform -strict -summary
          helm template ci-app deploy/charts/procure-app --namespace procure --set global.imageTag=ci --set name=ci-api \
              --set image.repository=procure-ai-ci --set migration.enabled=true --set migration.createPostgresDatabase=cidb \
              --set ingress.enabled=true --set ingress.host=ci.example.test \
            | kubeconform -strict -summary
          helm template procure-ai deploy/charts/procure-ai --namespace procure --set global.imageTag=ci \
              --set global.demo.seed=true --set global.demo.reset=true \
            | kubeconform -strict -summary
          # The dashboard Ingress's Traefik Middleware (plan 08b) against the community CRD schema catalog, as in the next step.
          helm template observability deploy/charts/procure-observability --namespace observability \
            | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/49729e49e8f062933e3716a26540d41b0cd0856c/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          # The operator's web UIs (plan 08b Task 4), Traefik Middlewares included.
          helm template operator deploy/charts/procure-ops --namespace operator \
            | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/49729e49e8f062933e3716a26540d41b0cd0856c/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      # Plan 08 final review B I1: render every chart with each GitOps environment's values (envs/local and envs/hosted), as Argo CD renders
      # them, so a chart change that breaks an environment's values (a renamed key, a branch only hosted uses: publicPathsOnly,
      # publicRealms, mailpit off, assistant.secretEnv, web.configJson) fails here instead of in Argo CD on the public VM. The GitOps repo
      # has no CI; its own tests/Test-RenderEnvs.ps1 renders the same before every values push there.
      - name: Render every chart with each GitOps environment's values (kubeconform -strict)
        run: |
          set -euo pipefail
          # Custom resources (the hosted Keycloak rate limit's Traefik Middleware) against the community CRD schema catalog.
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/49729e49e8f062933e3716a26540d41b0cd0856c/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kc() { kubeconform -strict -summary -schema-location default -schema-location "$crds"; }
          for env in local hosted; do
            dir="../procure-ai-gitops/envs/$env"
            for file in platform procure-ai observability; do test -f "$dir/$file.yaml"; done
            echo "== envs/$env"
            helm template platform deploy/charts/procure-platform --namespace procure -f "$dir/platform.yaml" --set global.imageTag=ci \
              | kc
            helm template procure-ai deploy/charts/procure-ai --namespace procure -f "$dir/procure-ai.yaml" --set global.imageTag=ci \
              | kc
            helm template observability deploy/charts/procure-observability --namespace observability -f "$dir/observability.yaml" \
                --set global.imageTag=ci \
              | kc
            # The operator's web UIs (plan 08b Task 4): only once the GitOps repo has their values (pushed after this chart exists).
            if [ -f "$dir/operator.yaml" ]; then
              helm template operator deploy/charts/procure-ops --namespace operator -f "$dir/operator.yaml" | kc
            fi
          done

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: procure-ai/global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('procure-ai/Directory.Packages.props', 'procure-ai/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: ./procure-ai/.github/actions/ci-secrets

      - name: Build the AppHost tests
        run: dotnet build tests/ProcureAi.AppHost.Tests -c Release -warnaserror -m:4

      # The parity tests use the GitOps env files (local and hosted) only when they find them; fail here instead of letting them silently
      # check less.
      - name: GitOps env files are beside the repo
        run: test -f ../procure-ai-gitops/envs/local/procure-ai.yaml && test -f ../procure-ai-gitops/envs/hosted/procure-ai.yaml

      # Only the chart parity classes (seconds); the AppHost's other tests are a long suite in the dotnet job. --fail-skips: a test that
      # skips because helm is missing fails here (MTP needs the value: "--fail-skips on").
      - name: Chart parity tests (AppHost model against the rendered charts)
        run: >-
          dotnet test --project tests/ProcureAi.AppHost.Tests -c Release --no-build --timeout 10m --fail-skips on
          --filter-class ProcureAi.AppHost.Tests.ChartParityTests --filter-class ProcureAi.AppHost.Tests.PlatformChartTests
          --filter-class ProcureAi.AppHost.Tests.ChartDebeziumTests

  images:
    # A long suite (FULL): publish.yml also builds the same images after every green push run, and pushes them.
    name: Container images (build and test, no push)
    needs: [weekly-gate]
    if: ${{ !cancelled() && needs.weekly-gate.result != 'failure' && needs.weekly-gate.outputs.skip != 'true' && inputs.profile != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Builds every image of deploy/scripts/build-images.ps1 to prove they build; nothing is pushed and no secret is needed
    # (publish.yml pushes them to GitHub Container Registry after CI passed).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build all images
        shell: pwsh
        run: ./deploy/scripts/build-images.ps1 -Tag ci

      # Starts the images (Keycloak against a throwaway Postgres, nginx, the .NET apps without configuration). About a minute.
      - name: Test the images
        shell: pwsh
        run: ./deploy/scripts/test-images.ps1 -Tag ci

  e2e:
    name: System and end-to-end tests
    needs: [weekly-gate, dotnet, web]
    # A long suite (FULL), and only after the build and the other suites passed. It was off on the private 8 GB runner (E2E-OFF, plan 08
    # Task 14: the runner was killed while the AppHost started); public repos get the 4-CPU, 16 GB runner (plan 08c Task 2), but the stack
    # does not fit it yet. E2E-PUSH-OFF, E2E-DISPATCH-ONLY: only a hand-started run (workflow_dispatch) runs it, never a push or the weekly
    # run, until the AppHost stack fits the 16 GB runner (top of this file).
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.weekly-gate.result != 'failure' && needs.weekly-gate.outputs.skip != 'true' && inputs.profile != 'push' &&
      (inputs.only == '' || inputs.only == null || contains(format(' {0} ', inputs.only), ' e2e ')) &&
      needs.dotnet.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Web/procure-ai-web/package-lock.json

      - name: Docker Hub login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trust the ASP.NET Core dev certificate (the Aspire gateway health check uses HTTPS)
        run: |
          # Exit code 4 only means "not trusted system-wide"; the OpenSSL trust directory below is what .NET uses on Linux.
          dotnet dev-certs https --trust || true
          ls "$HOME/.aspnet/dev-certs/trust"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # KNOWN OPEN (plan 08 Task 14): on the private-repo runner (8 GB RAM: mongod saw 7 932 MB) the runner was killed a few minutes into
      # the system tests twice ("The runner has received a shutdown signal"), while the whole AppHost was starting; a 12 GB swap file
      # filled the disk instead. Memory or disk exhaustion; the log below records both. On the public 4-CPU, 16 GB runner (plan 08c Task 2)
      # the stack still peaked at ~14.8 GB used with the runner's 4 GB swap ~3 GB full; the runner was killed the same way in 2 of 4 push
      # runs, and with an extra 8 GB swap file it hung instead. Hence E2E-PUSH-OFF / E2E-DISPATCH-ONLY (top of this file), the build
      # servers stopped after the build, and the biggest processes in the log.
      - name: Log memory and disk every 30 s (printed at the end)
        run: |
          cat > "$RUNNER_TEMP/memlog.sh" <<'SCRIPT'
          while :; do
            echo "$(date -u +%T) $(free -m | awk '/Mem:/ {print "mem used", $3, "avail", $7} /Swap:/ {print "swap used", $3}' | xargs) disk free $(df -m --output=avail / | tail -1) MB"
            echo "  top RSS MB: $(ps -eo rss=,comm= --sort=-rss | head -6 | awk '{printf "%s %d; ", $2, $1/1024}')"
            sleep 30
          done
          SCRIPT
          nohup bash "$RUNNER_TEMP/memlog.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &

      - uses: ./.github/actions/ci-secrets

      - name: Build
        run: |
          dotnet build tests/ProcureAi.EndToEndTests -c Release -warnaserror -m:4
          dotnet build tests/ProcureAi.SystemTests -c Release -warnaserror -m:4
          # The MSBuild nodes and the compiler server stay alive after a build and hold memory the AppHost stack needs.
          dotnet build-server shutdown

      - name: Install Playwright browser and OS dependencies
        shell: pwsh
        run: ./tests/ProcureAi.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The whole system through the services' own APIs (starts the AppHost); one after the other with Playwright, never together.
      - name: System tests (whole system through the AppHost)
        timeout-minutes: 20
        run: dotnet run --project tests/ProcureAi.SystemTests -c Release --no-build

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: >
          dotnet test --project tests/ProcureAi.EndToEndTests -c Release --no-build --timeout 30m
          --report-xunit-trx --results-directory "$RUNNER_TEMP/trx-e2e"

      - name: Memory and disk during the run
        if: always()
        run: cat "$RUNNER_TEMP/memory.log" || true

      - name: Upload test results and Playwright output
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/trx-e2e
            tests/ProcureAi.EndToEndTests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore
