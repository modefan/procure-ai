name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    name: Build and test (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # TESTS DISABLED IN CI until the app is done (Dale's call, 2026-10-26): Claude runs every suite locally before each push.
    # Re-enable by removing the `if: false` lines (marked TESTS-OFF) and fix whatever fails.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Docker Hub login (avoids pull rate limits)
        if: false # TESTS-OFF
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trust the ASP.NET Core dev certificate (the Aspire gateway health check uses HTTPS)
        if: false # TESTS-OFF
        run: |
          # Exit code 4 only means "not trusted system-wide"; the OpenSSL trust directory below is what .NET uses on Linux.
          dotnet dev-certs https --trust || true
          ls "$HOME/.aspnet/dev-certs/trust"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - uses: ./.github/actions/ci-secrets

      - name: Build
        run: dotnet build ProcureAi.slnx -c Release -warnaserror -m:4

      # One project at a time: the container-based suites must never run concurrently.
      # Safety nets: every project gets its own test timeout (MTP --timeout), so a hang fails that project by name
      # instead of silently using up the job timeout; the step itself is bounded below the job timeout.
      - name: Test
        if: false # TESTS-OFF
        shell: bash
        timeout-minutes: 35
        run: |
          set -o pipefail
          status=0
          summary=""
          for project in tests/*/; do
            name="$(basename "$project")"
            # Only test projects (*Tests); shared libraries such as ProcureAi.Testing have no tests.
            case "$name" in *Tests) ;; *) continue ;; esac
            # The end-to-end projects start the whole AppHost; they run in the e2e job instead.
            if [ "$name" = "ProcureAi.EndToEndTests" ] || [ "$name" = "ProcureAi.SystemTests" ]; then continue; fi
            echo "::group::$name"
            start=$SECONDS
            result=passed
            dotnet test --project "$project" -c Release --no-build --timeout 12m \
              --report-xunit-trx --results-directory "$RUNNER_TEMP/trx" || { status=1; result=FAILED; }
            echo "::endgroup::"
            line="$name: $result in $((SECONDS - start)) s"
            echo "$line"
            if [ "$result" = FAILED ]; then echo "::error::$line"; fi
            summary+="$line"$'\n'
          done
          printf '### .NET test projects\n\n```\n%s```\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ${{ runner.temp }}/trx
          if-no-files-found: ignore

  web:
    name: Angular build, test and client drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Web/procure-ai-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/procure-ai-web/package-lock.json

      # .NET is needed only to regenerate the OpenAPI documents (each is written when its API project is built).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
        if: false # TESTS-OFF

      - name: Regenerate OpenAPI document and API client
        run: |
          for service in Requests Access Budgets Approvals Audit Suppliers Purchasing; do
            dotnet build "../../Services/$service/ProcureAi.$service.Api" -c Release -m:4
          done
          npm run generate:api

      - name: Fail on client drift
        working-directory: .
        run: |
          paths="src/Services/Requests/ProcureAi.Requests.Api/openapi src/Services/Access/ProcureAi.Access.Api/openapi src/Services/Budgets/ProcureAi.Budgets.Api/openapi src/Services/Approvals/ProcureAi.Approvals.Api/openapi src/Services/Audit/ProcureAi.Audit.Api/openapi src/Services/Suppliers/ProcureAi.Suppliers.Api/openapi src/Services/Purchasing/ProcureAi.Purchasing.Api/openapi src/Web/procure-ai-web/src/app/api"
          # git status also lists new untracked files, which git diff would miss.
          drift="$(git status --porcelain -- $paths)"
          if [ -n "$drift" ]; then
            echo "::error::Generated OpenAPI document or API client differs from what is committed. Regenerate and commit."
            echo "$drift"
            git diff -- $paths | head -200
            exit 1
          fi

  e2e:
    name: End-to-end (Playwright)
    if: false # TESTS-OFF
    needs: [dotnet, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/procure-ai-web/package-lock.json

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trust the ASP.NET Core dev certificate (the Aspire gateway health check uses HTTPS)
        run: |
          # Exit code 4 only means "not trusted system-wide"; the OpenSSL trust directory below is what .NET uses on Linux.
          dotnet dev-certs https --trust || true
          ls "$HOME/.aspnet/dev-certs/trust"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - uses: ./.github/actions/ci-secrets

      - name: Build
        run: dotnet build tests/ProcureAi.EndToEndTests -c Release -warnaserror -m:4

      - name: Install Playwright browser and OS dependencies
        shell: pwsh
        run: ./tests/ProcureAi.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The whole system through the services' own APIs (starts the AppHost); one after the other with Playwright, never together.
      - name: System tests (all five services)
        if: false # TESTS-OFF
        run: dotnet run --project tests/ProcureAi.SystemTests -c Release

      - name: End-to-end tests
        run: >
          dotnet test --project tests/ProcureAi.EndToEndTests -c Release --no-build --timeout 30m
          --report-xunit-trx --results-directory "$RUNNER_TEMP/trx-e2e"

      - name: Upload test results and Playwright output
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/trx-e2e
            tests/ProcureAi.EndToEndTests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore
