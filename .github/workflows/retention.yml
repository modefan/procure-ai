name: retention

# Keeps the newest 15 versions of every image in GitHub Container Registry and deletes older ones (plan 07 ruling 1), so the private
# packages stay small. The deployed revision is always among the newest unless appRevision was pinned by hand to an old commit: re-run
# the publish workflow for that commit (or pin a newer one) before this runs.
# The packages are linked to this repository (publish.yml labels the images with it), which gives this workflow's GITHUB_TOKEN admin
# access to them.

on:
  schedule:
    # Mondays 03:17 UTC (05:17 in Johannesburg).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    name: Prune procure-ai-${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # The images of deploy/scripts/build-images.ps1.
        image: [access-api, approvals-api, assistant-api, audit-api, budgets-api, invoicing-api, notifications-api, purchasing-api,
                requests-api, suppliers-api, gateway, simulators, demo-data, web, postgres, keycloak, debezium]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: procure-ai-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 15
