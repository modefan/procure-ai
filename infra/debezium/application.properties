# Debezium Server: Postgres (requestsdb) -> RabbitMQ exchange "cdc".
# Secrets and the RabbitMQ credentials are NOT here: the AppHost passes them as environment
# variables (DEBEZIUM_SOURCE_DATABASE_PASSWORD, DEBEZIUM_SINK_RABBITMQ_CONNECTION_USERNAME/PASSWORD).
# Capture is covered by tests/ProcureAi.Requests.IntegrationTests/AuditTests.cs, which runs this file.

# --- Sink: RabbitMQ (AMQP, exchange based) ---
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
# The exchange "cdc" (topic) is declared by the AppHost (CdcExchangeHealthCheck in
# src/AppHost/ProcureAi.AppHost, a health check on the rabbitmq resource that Debezium waits for);
# the sink only publishes. The routing key is the Debezium topic name: <prefix>.<schema>.<table>.
debezium.sink.rabbitmq.exchange=cdc
debezium.sink.rabbitmq.routingKey.source=topic
debezium.sink.rabbitmq.autoCreateRoutingKey=false

# --- Source: Postgres logical decoding ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.dbname=requestsdb
# Routing keys on the cdc exchange are <prefix>.<schema>.<table>, e.g. requestsdb.public.purchase_requests.
debezium.source.topic.prefix=requestsdb
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_requests
debezium.source.table.include.list=public.purchase_requests,public.request_lines

# Debezium must start and stay healthy before the Requests migration has created the tables:
#  - publication.autocreate.mode=disabled: Debezium would otherwise run CREATE PUBLICATION ... FOR TABLE
#    (fails for missing tables) or ... FOR ALL TABLES (needs superuser). Instead the Postgres init script
#    creates an empty publication "dbz_publication" owned by the superuser, and each service's migration
#    adds its tables with ALTER PUBLICATION (see the AddAuditEntriesAndCdc migration). Only business tables are
#    added; audit_entries and the wolverine schema are never captured.
#  - snapshot.mode=no_data: no initial snapshot (nothing to read yet); only changes from now on are captured.
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled
debezium.source.snapshot.mode=no_data

# --- Message format ---
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --- HTTP (health: /q/health) ---
quarkus.http.port=8080
quarkus.log.level=INFO
