# Debezium Server for MongoDB (plan 06 ruling 16): the change streams of the captured collections -> RabbitMQ exchange "cdc".
# One instance (debezium-mongo) reads every captured MongoDB database, since one MongoDB connector watches the whole replica set.
# The AppHost (AddDebeziumForMongo) and the tests (MongoDebeziumFixture) pass what differs per environment as environment variables:
#   DEBEZIUM_SOURCE_MONGODB_CONNECTION_STRING (with the credentials; directConnection=true, as Aspire's single-member replica set wants),
#   DEBEZIUM_SOURCE_COLLECTION_INCLUDE_LIST (<database>.<collection>,...), the RabbitMQ credentials and the self-heal switch below.
# The Postgres instances use application.properties; the sink and message format here are the same.

# --- Sink: RabbitMQ (AMQP, exchange based) ---
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
# The exchange "cdc" (topic) is declared by the AppHost (CdcExchangeHealthCheck); the sink only publishes.
debezium.sink.rabbitmq.exchange=cdc
debezium.sink.rabbitmq.routingKey.source=topic
debezium.sink.rabbitmq.autoCreateRoutingKey=false

# --- Source: MongoDB change streams ---
debezium.source.connector.class=io.debezium.connector.mongodb.MongoDbConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000
# Routing keys on the cdc exchange are mongo.<database>.<collection>, e.g. mongo.suppliersdb.suppliers. The Postgres keys are
# <database>.public.<table>, so Audit binds its two queues apart: audit-cdc to *.public.*, audit-cdc-mongo to mongo.#.
debezium.source.topic.prefix=mongo
# An update carries the whole document ("after") next to what changed ("updateDescription"). Careful: for an update "after" is a lookup
# made when Debezium READS the event, not the state at the update: when Debezium lags, the document may already be changed again or
# deleted (after = null). Audit therefore takes an update's stamp from updatedFields._audit and rebuilds its values from the previous
# change plus updatedFields/removedFields (MongoChange.ToDataChange); the lookup is only a fallback. Inserts and replaces carry the
# document the change itself wrote.
debezium.source.capture.mode=change_streams_update_full
# No data snapshot ever: only changes from now on (the demo seed written by --migrate runs before Debezium starts). A lost
# offset (the resume token is no longer in the oplog, e.g. the database volume was reset while the offsets volume survived)
# fails loudly here; the AppHost switches self-healing on for local runs through
# DEBEZIUM_SOURCE_SNAPSHOT_MODE_CONFIGURATION_BASED_SNAPSHOT_ON_DATA_ERROR, as for Postgres.
debezium.source.snapshot.mode=configuration_based
debezium.source.snapshot.mode.configuration.based.snapshot.data=false
debezium.source.snapshot.mode.configuration.based.snapshot.schema=false
debezium.source.snapshot.mode.configuration.based.start.stream=true
debezium.source.snapshot.mode.configuration.based.snapshot.on.schema.error=false
debezium.source.snapshot.mode.configuration.based.snapshot.on.data.error=false
# A delete is one message; no extra empty "tombstone" message.
debezium.source.tombstones.on.delete=false

# A delete event carries no document, only its key, and the RabbitMQ sink publishes only the value. This copies the key's "id"
# (the document's _id as JSON, e.g. "\"acme:contoso-hardware\"") into the AMQP header documentKey, which Audit reads.
debezium.transforms=documentKey
debezium.transforms.documentKey.type=org.apache.kafka.connect.transforms.HeaderFrom$Key
debezium.transforms.documentKey.fields=id
debezium.transforms.documentKey.headers=documentKey
debezium.transforms.documentKey.operation=copy

# --- Message format (headers as plain JSON values, without a schema wrapper) ---
debezium.format.key=json
debezium.format.value=json
debezium.format.header=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
debezium.format.header.schemas.enable=false

# --- HTTP (health: /q/health) ---
quarkus.http.port=8080
quarkus.log.level=INFO
